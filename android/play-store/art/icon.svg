<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <!-- Same artwork as the Android launcher icon (res/drawable/ic_launcher_foreground.xml),
       drawn larger: the store icon has no adaptive-icon safe zone. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#1c1f25"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>
  <rect width="108" height="108" fill="url(#bg)"/>
  <g transform="translate(54 56) scale(1.38) translate(-54 -54)">
    <rect x="28" y="30" width="52" height="4" fill="#ff8a3d" filter="url(#glow)" opacity="0.8"/>
    <rect x="28" y="30" width="52" height="4" fill="#ff8a3d"/>
    <rect x="28" y="34" width="52" height="40" fill="#f4f4f4"/>
    <rect x="30" y="36" width="11" height="36" fill="#15171b"/>
    <rect x="43" y="36" width="11" height="36" fill="#15171b"/>
    <rect x="56" y="36" width="11" height="36" fill="#15171b"/>
    <rect x="69" y="36" width="9" height="36" fill="#15171b"/>
    <rect x="37" y="36" width="9" height="22" fill="#f4f4f4"/>
    <rect x="50" y="36" width="9" height="22" fill="#f4f4f4"/>
    <rect x="65" y="36" width="8" height="22" fill="#f4f4f4"/>
  </g>
</svg>
