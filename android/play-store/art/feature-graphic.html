<!doctype html>
<html lang="en">
<head>

<title>E-Piano feature graphic</title>
<!-- Rendered to 1024x500 by ../render.mjs. Keep text away from the edges:
     Google Play may crop or overlay them. -->
<style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    background: radial-gradient(900px 420px at 30% -10%, #23262d 0%, #0a0b0d 65%) #0a0b0d;
    font-family: "Segoe UI", system-ui, sans-serif; color: #e6e7ea;
    position: relative;
  }
  .text { position: absolute; left: 84px; top: 92px; }
  .mark { font-size: 76px; font-weight: 800; letter-spacing: 0.18em; line-height: 1; }
  .sub  { margin-top: 14px; font-size: 19px; letter-spacing: 0.3em; color: #ff8a3d;
          text-shadow: 0 0 14px rgba(255, 138, 61, 0.45); }

  .keys { position: absolute; right: 72px; top: 96px; width: 380px; height: 300px;
          filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.8)); }
</style>
</head>
<body>
