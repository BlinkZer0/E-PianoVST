<!doctype html>
<!--
  E-Piano v0.9 (web build)
  A single self-contained file: UI, DSP, 80 factory presets. Mirrors the VST3 build in vst/.
  Open it in Chrome or Edge. Works straight from disk; start.bat serves it over
  http://localhost for the lower-latency AudioWorklet path.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E-Piano v0.9</title>
  <style>
:root {
  --bg: #0a0b0d;
  --chassis-1: #1b1d21;
  --chassis-2: #121417;
  --panel: #16181c;
  --panel-edge: #262a30;
  --screen: #07080a;
  --text: #e6e7ea;
  --muted: #8a9099;
  --faint: #4a4f57;
  --accent: #ff8a3d;
  --accent-glow: rgba(255, 138, 61, 0.45);
  --accent-dim: #5a3118;
  --track: #2a2e35;
  --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Cascadia Mono", "Consolas", ui-monospace, monospace;
}

* { box-sizing: border-box; }

html, body { margin: 0; }
body {
  min-height: 100vh;
  background: radial-gradient(1200px 600px at 50% -10%, #1a1c21 0%, var(--bg) 60%) var(--bg);
  color: var(--text);
  font-family: var(--sans);
  display: flex;
  justify-content: center;
  padding: 24px 16px;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; color: inherit; }

.synth {
  width: 100%;
  min-width: 0;
  max-width: 1080px;
  background: linear-gradient(180deg, var(--chassis-1), var(--chassis-2));
  border: 1px solid var(--panel-edge);
  border-radius: 16px;
  padding: 18px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  display: flex;
  flex-direction: column;
  gap: 14px;
  user-select: none;
}

/* ---------------------------------------------------------------- LEDs --- */
.led {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #2b2420;
  box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.6);
  flex: none;
  transition: background 60ms, box-shadow 60ms;
}
.led.on, .selected > .led, .power.on .led {
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent-glow), 0 0 2px var(--accent);
}

.ctl-label, .panel-title, .knob-label, .pd-label, .vs-label {
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}

/* -------------------------------------------------------------- top bar --- */
.topbar {
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
}
.brand { display: flex; flex-direction: column; line-height: 1.1; }
.brand-mark { font-size: 22px; font-weight: 800; letter-spacing: 0.18em; }
.brand-sub { font-size: 10px; letter-spacing: 0.22em; color: var(--accent); margin-top: 3px; }

.patch-display {
  flex: 1;
  min-width: 200px;
  display: flex;
  align-items: baseline;
  gap: 10px;
  background: var(--screen);
  border: 1px solid #000;
  border-radius: 6px;
  padding: 8px 12px;
  box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.8);
}
.pd-name { font-family: var(--mono); color: var(--accent); font-size: 15px; text-shadow: 0 0 8px var(--accent-glow); }

.top-controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.midi-pick { display: flex; align-items: center; gap: 8px; }
.midi-pick select {
  background: var(--screen);
  color: var(--text);
  border: 1px solid var(--panel-edge);
  border-radius: 5px;
  padding: 5px 8px;
  font: 12px var(--sans);
  max-width: 220px;
}
.indicator { display: flex; align-items: center; gap: 6px; font-size: 10px; letter-spacing: 0.14em; color: var(--muted); font-weight: 600; }

.panic {
  background: #2a1512;
  border: 1px solid #5b2a22;
  color: #ff9c8a;
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 11px;
  letter-spacing: 0.14em;
  font-weight: 700;
  cursor: pointer;
}
.panic:hover { background: #3a1a15; }
.panic:active { transform: translateY(1px); }

/* --------------------------------------------------------------- panels --- */
.osc-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.mod-row { display: grid; grid-template-columns: 1fr 1fr 0.55fr; gap: 12px; }

.panel {
  background: var(--panel);
  border: 1px solid var(--panel-edge);
  border-radius: 10px;
  padding: 10px 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
  transition: opacity 150ms;
  min-width: 0;
}
.panel.off .screen, .panel.off .knob-row { opacity: 0.38; }
.panel-head { display: flex; align-items: center; justify-content: space-between; min-height: 22px; }
.panel-title { color: var(--text); }

.power {
  display: flex; align-items: center; gap: 6px;
  background: #1f2226;
  border: 1px solid var(--panel-edge);
  border-radius: 5px;
  padding: 3px 8px;
  font-size: 10px; letter-spacing: 0.14em; font-weight: 700;
  color: var(--muted);
  cursor: pointer;
}
.power.on { color: var(--text); }

.screen {
  position: relative;
  background: var(--screen);
  border: 1px solid #000;
  border-radius: 6px;
  height: 56px;
  overflow: hidden;
  box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.9);
}
.screen svg { position: absolute; inset: 4px 0; width: 100%; height: calc(100% - 8px); }
.scr-grid { stroke: #1a1d22; stroke-width: 1; vector-effect: non-scaling-stroke; }
.scr-line {
  fill: none;
  stroke: var(--accent);
  stroke-width: 1.6;
  vector-effect: non-scaling-stroke;
  filter: drop-shadow(0 0 3px var(--accent-glow));
  stroke-linejoin: round;
}
.scr-text {
  position: absolute; right: 8px; top: 5px;
  font-family: var(--mono); font-size: 10px; color: #c9cdd3;
  background: rgba(7, 8, 10, 0.75);
  padding: 1px 4px; border-radius: 3px;
}

.voice-screen { display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 0 10px; }
.vs-row { display: flex; justify-content: space-between; align-items: baseline; }
.vs-value { font-family: var(--mono); color: var(--muted); font-size: 12px; }
.vs-value b { color: var(--accent); font-size: 16px; font-weight: 600; }
.meter { position: relative; height: 6px; background: #15171a; border-radius: 3px; overflow: hidden; }
#meter-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, #3d8f5a 0%, #b8b23b 75%, #ff5a3d 100%);
  background-size: 100% 100%;
  transition: width 60ms linear;
}
.meter-clip { position: absolute; right: 0; top: 0; width: 6px; height: 100%; background: #3a1512; }
.meter-clip.on { background: #ff3b2f; box-shadow: 0 0 6px #ff3b2f; }

/* ---------------------------------------------------------------- knobs --- */
.knob-row { display: flex; justify-content: space-around; gap: 4px; }
.knob { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 64px; }
.knob-svg { width: 56px; height: 56px; cursor: ns-resize; touch-action: none; outline: none; overflow: visible; }
.knob-svg:focus-visible .k-face { stroke: var(--accent); }
.k-track { fill: none; stroke: var(--track); stroke-width: 4; stroke-linecap: round; }
.k-value { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; filter: drop-shadow(0 0 3px var(--accent-glow)); }
.k-tick { fill: var(--faint); }
.k-face { fill: url(#knobFace); stroke: #050607; stroke-width: 1.5; }
.k-pointer { stroke: #f4f4f4; stroke-width: 2.6; stroke-linecap: round; }
.knob:hover .k-track { stroke: #343941; }
.knob-value { font-family: var(--mono); font-size: 11px; color: var(--text); min-height: 14px; white-space: nowrap; }
.knob.active .knob-value { color: var(--accent); }
.knob-label { font-size: 9px; }

.output-panel .knob-row { flex: 1; align-items: center; }

/* --------------------------------------------------------------- keybed --- */
.keybed {
  display: flex;
  gap: 14px;
  background: #000;
  border: 1px solid #1c1e22;
  border-radius: 12px;
  padding: 12px;
  box-shadow: inset 0 4px 14px rgba(0, 0, 0, 0.9);
}
.octave-ctl {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; width: 92px; flex: none;
}
.oct-buttons { display: flex; gap: 6px; }
.oct-buttons button {
  width: 34px; height: 30px;
  background: #1c1e22; border: 1px solid #30343b; border-radius: 6px;
  font-size: 18px; line-height: 1; cursor: pointer;
}
.oct-buttons button:hover { border-color: var(--accent-dim); }
.oct-buttons button:active { transform: translateY(1px); }
.oct-readout { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.kbd-hint { font-size: 10px; color: var(--faint); text-align: center; line-height: 1.4; }

.piano { flex: 1; min-width: 0; }
.piano-svg { display: block; width: 100%; height: auto; touch-action: none; cursor: pointer; }
.felt { fill: #5a1a17; }

/* Inverted keyboard: naturals black, sharps white */
.wkey { fill: #0c0c0d; stroke: #34363b; stroke-width: 1; transition: fill 40ms; }
.wkey:hover { fill: #17181a; }
.wkey.down { fill: var(--accent); stroke: var(--accent); }
.bkey { fill: #f2f1ee; stroke: #8f8f8f; stroke-width: 1; transition: fill 40ms; }
.bkey:hover { fill: #ffffff; }
.bkey.down { fill: var(--accent); stroke: #b85a20; }
.klabel { fill: #5b6068; font: 600 11px var(--sans); text-anchor: middle; pointer-events: none; }

/* ------------------------------------------------------------ statusbar --- */
.statusbar {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  font-family: var(--mono); font-size: 11px; color: var(--muted);
  padding: 0 4px;
}
.monitor { flex: 1; min-width: 0; white-space: pre; overflow: hidden; text-overflow: ellipsis; }
.audio-status { display: flex; align-items: center; gap: 6px; flex: none; }

/* ======================================================== preset browser === */
.patch-display { align-items: center; gap: 6px; padding: 5px 6px; }
.pd-text { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; padding: 0 4px; }
.pd-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pd-step {
  flex: none; width: 26px; height: 26px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  background: #15171a; border: 1px solid var(--panel-edge); border-radius: 5px; cursor: pointer;
}
.pd-step svg { width: 12px; height: 12px; fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.pd-step:hover svg { stroke: var(--accent); }
.pd-step:active { transform: translateY(1px); }

.preset-actions { display: flex; gap: 6px; }
.pd-btn {
  background: linear-gradient(180deg, #24272c, #1b1d21);
  border: 1px solid var(--panel-edge);
  border-radius: 6px;
  padding: 6px 11px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
  color: var(--text);
  cursor: pointer;
}
.pd-btn:hover { border-color: #3a3f47; }
.pd-btn:active { transform: translateY(1px); }
.pd-btn.primary { background: linear-gradient(180deg, #3a2618, #2a1c13); border-color: var(--accent-dim); color: var(--accent); }
.pd-btn.primary:hover { border-color: var(--accent); }
.pd-btn.danger { background: #2a1512; border-color: #5b2a22; color: #ff9c8a; }

.browser {
  background: var(--panel);
  border: 1px solid var(--panel-edge);
  border-radius: 10px;
  padding: 8px;
  display: flex; flex-direction: column; gap: 8px;
}
.cat-tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.cat-tab {
  position: relative;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 5px;
  padding: 4px 10px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--muted);
  cursor: pointer;
}
.cat-tab:hover { color: var(--text); }
.cat-tab.active { color: var(--accent); border-color: var(--accent-dim); background: #221a14; }
.cat-tab.has-current::after {
  content: ""; position: absolute; top: 3px; right: 3px;
  width: 4px; height: 4px; border-radius: 50%; background: var(--accent);
}

.preset-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  grid-auto-rows: 30px;
  gap: 6px;
  height: 66px;            /* two rows; user folders with more scroll */
  overflow-y: auto;
  padding-right: 2px;
}
.preset-btn {
  position: relative;
  display: flex; align-items: center;
  padding: 0 24px 0 10px;
  background: linear-gradient(180deg, #23262b, #1a1c20);
  border: 1px solid var(--panel-edge);
  border-radius: 6px;
  font-size: 12px; font-weight: 600; text-align: left;
  cursor: pointer;
  min-width: 0;
}
.preset-btn:hover { border-color: #3a3f47; }
.preset-btn:active { transform: translateY(1px); }
.preset-btn.selected { border-color: var(--accent); background: linear-gradient(180deg, #2c221b, #1d1916); color: var(--accent); }
.pb-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pb-del {
  position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
  width: 18px; height: 18px; line-height: 17px; text-align: center;
  border-radius: 4px; color: var(--muted); font-size: 14px;
  opacity: 0;
}
.preset-btn:hover .pb-del { opacity: 1; }
.pb-del:hover { background: #3a1a15; color: #ff9c8a; }
.grid-empty { grid-column: 1 / -1; grid-row: 1 / 3; align-self: center; font-size: 12px; color: var(--muted); line-height: 1.6; padding: 0 4px; }
.path { font-family: var(--mono); color: var(--text); font-size: 11px; word-break: break-all; }

.preset-grid::-webkit-scrollbar { width: 6px; }
.preset-grid::-webkit-scrollbar-thumb { background: #30343b; border-radius: 3px; }

/* ================================================================ modal === */
.modal {
  position: fixed; inset: 0; z-index: 20;
  display: flex; align-items: center; justify-content: center;
  background: rgba(5, 6, 8, 0.7);
}
.modal.hidden { display: none; }
.modal-card {
  width: min(420px, calc(100vw - 32px));
  background: linear-gradient(180deg, #1d2024, #15171a);
  border: 1px solid var(--panel-edge);
  border-radius: 12px;
  padding: 18px;
  display: flex; flex-direction: column; gap: 12px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
}
.modal-title { font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
.modal-body { font-size: 13px; color: var(--muted); line-height: 1.5; }
.modal-body b { color: var(--text); }
#modal-input {
  background: var(--screen); color: var(--accent);
  border: 1px solid var(--panel-edge); border-radius: 6px;
  padding: 9px 10px; font: 14px var(--mono); outline: none;
  user-select: text;
}
#modal-input:focus { border-color: var(--accent-dim); }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

/* ----------------------------------------------------------- responsive --- */
@media (max-width: 900px) {
  .osc-row, .mod-row { grid-template-columns: minmax(0, 1fr); }
  .preset-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); height: 102px; }
}
@media (max-width: 560px) {
  body { padding: 12px 8px; }
  .synth { padding: 12px; }
  .patch-display { min-width: 0; flex-basis: 100%; }
  .preset-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .knob { width: 56px; }
  .keybed { flex-direction: column; }
  .octave-ctl { flex-direction: row; width: auto; }
  .kbd-hint { display: none; }
}
  </style>
</head>
<body>
  <!-- shared SVG defs (knob face gradient) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="knobFace" cx="38%" cy="30%" r="80%">
        <stop offset="0%" stop-color="#3b3f46"/>
        <stop offset="60%" stop-color="#1d2024"/>
        <stop offset="100%" stop-color="#121417"/>
      </radialGradient>
    </defs>
  </svg>

  <main class="synth">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">E·PIANO</span>
        <span class="brand-sub">3-OSC · 88-VOICE · v0.9</span>
      </div>
      <div class="patch-display">
        <button id="preset-prev" type="button" class="pd-step" aria-label="Previous preset">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M8 2 4 6l4 4"/></svg>
        </button>
        <div class="pd-text">
          <span id="preset-cat" class="pd-label">VOICE</span>
          <span id="preset-name" class="pd-name"></span>
        </div>
        <button id="preset-next" type="button" class="pd-step" aria-label="Next preset">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m4 2 4 4-4 4"/></svg>
        </button>
      </div>
      <div class="preset-actions">
        <button id="preset-save" type="button" class="pd-btn">SAVE</button>
        <button id="preset-load" type="button" class="pd-btn">LOAD</button>
        <button id="preset-folder" type="button" class="pd-btn">FOLDER</button>
      </div>
      <div class="top-controls">
        <label class="midi-pick">
          <span class="led" id="midi-led" title="MIDI activity"></span>
          <span class="ctl-label">MIDI IN</span>
          <select id="midi-select"><option>Detecting…</option></select>
        </label>
        <span class="indicator"><span class="led" id="sustain-led"></span>SUS</span>
        <button id="panic-btn" type="button" class="panic">PANIC</button>
      </div>
    </header>

    <section class="browser" aria-label="Presets">
      <div class="cat-tabs" id="cat-tabs" role="tablist"></div>
      <div class="preset-grid" id="preset-grid"></div>
    </section>
    <section class="osc-row" id="osc-row"></section>
    <section class="mod-row" id="mod-row"></section>

    <section class="keybed">
      <div class="octave-ctl">
        <span class="ctl-label">OCTAVE</span>
        <div class="oct-buttons">
          <button id="oct-down" type="button" aria-label="Octave down">−</button>
          <button id="oct-up" type="button" aria-label="Octave up">+</button>
        </div>
        <span id="octave-readout" class="oct-readout"></span>
        <span class="kbd-hint">Keys: A–' play<br>Z / X octave</span>
      </div>
      <div id="piano" class="piano"></div>
    </section>

    <footer class="statusbar">
      <span id="midi-monitor" class="monitor">MIDI: starting…</span>
      <span class="audio-status"><span class="led" id="audio-led"></span><span id="audio-info">Audio off</span></span>
    </footer>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <div id="modal-title" class="modal-title"></div>
      <div id="modal-body" class="modal-body"></div>
      <input id="modal-input" type="text" maxlength="60" spellcheck="false" autocomplete="off">
      <div class="modal-actions">
        <button id="modal-cancel" type="button" class="pd-btn">CANCEL</button>
        <button id="modal-ok" type="button" class="pd-btn primary">OK</button>
      </div>
    </div>
  </div>

  <script>
// ============================================================================
//  Parameter definitions (plugin copy). Must match vst/Source/Params.h.
//  Differs from web/js/params.js: adds ampLevel, pitch range is +/-36 st.
// ============================================================================
'use strict';

const WAVE_NAMES = ['Sine', 'Saw', 'Square', 'Triangle'];
const NUM_VOICES = 88;

function oscParams(n) {
  return [
    { id: `osc${n}On`,    name: 'On',    group: `osc${n}`, type: 'bool',   min: 0,   max: 1,   step: 1, def: n === 1 ? 1 : 0 },
    { id: `osc${n}Wave`,  name: 'Wave',  group: `osc${n}`, type: 'choice', min: 0,   max: 3,   step: 1, def: 0, choices: WAVE_NAMES },
    { id: `osc${n}Pitch`, name: 'Pitch', group: `osc${n}`, min: -36,  max: 36,  step: 1, def: 0, unit: 'st', bipolar: true },
    { id: `osc${n}Fine`,  name: 'Fine',  group: `osc${n}`, min: -100, max: 100, step: 1, def: 0, unit: 'ct', bipolar: true },
    { id: `osc${n}Level`, name: 'Level', group: `osc${n}`, min: 0,    max: 1,   def: 0.7, unit: '%' },
  ];
}

const PARAM_DEFS = [
  ...oscParams(1),
  ...oscParams(2),
  ...oscParams(3),
  { id: 'ampAttack',  name: 'Attack',  group: 'amp',    min: 0.001, max: 5,     def: 0.005, unit: 's', skew: 'log' },
  { id: 'ampDecay',   name: 'Decay',   group: 'amp',    min: 0.005, max: 10,    def: 1.0,   unit: 's', skew: 'log' },
  { id: 'ampSustain', name: 'Sustain', group: 'amp',    min: 0,     max: 1,     def: 0.7,   unit: '%' },
  { id: 'ampRelease', name: 'Release', group: 'amp',    min: 0.005, max: 10,    def: 0.3,   unit: 's', skew: 'log' },
  { id: 'ampLevel',   name: 'Amp',     group: 'amp',    min: -30,   max: 6,     def: 0,     unit: 'dB' },
  { id: 'fltCutoff',  name: 'Cutoff',  group: 'filter', min: 20,    max: 20000, def: 8000,  unit: 'Hz', skew: 'log' },
  { id: 'fltReso',    name: 'Reso',    group: 'filter', min: 0,     max: 1,     def: 0.1,   unit: '%' },
  { id: 'fltEnvAmt',  name: 'Env Amt', group: 'filter', min: 0,     max: 1,     def: 0.2,   unit: '%' },

];

const PARAM_BY_ID = Object.fromEntries(PARAM_DEFS.map(d => [d.id, d]));

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

function defaultParamValues() {
  return Object.fromEntries(PARAM_DEFS.map(d => [d.id, d.def]));
}

// value <-> 0..1 normalized (same mapping the VST host will see)
function paramToNorm(d, v) {
  if (d.skew === 'log') return clamp(Math.log(v / d.min) / Math.log(d.max / d.min), 0, 1);
  return clamp((v - d.min) / (d.max - d.min), 0, 1);
}

function paramFromNorm(d, n) {
  n = clamp(n, 0, 1);
  let v = d.skew === 'log' ? d.min * Math.pow(d.max / d.min, n) : d.min + n * (d.max - d.min);
  if (d.step) v = Math.round(v / d.step) * d.step;
  return clamp(v, d.min, d.max);
}

function formatParam(d, v) {
  if (d.type === 'choice') return d.choices[v | 0];
  if (d.type === 'bool') return v >= 0.5 ? 'On' : 'Off';
  switch (d.unit) {
    case 's':  return v < 1 ? `${Math.round(v * 1000)} ms` : `${v.toFixed(2)} s`;
    case 'Hz': return v >= 1000 ? `${(v / 1000).toFixed(v >= 10000 ? 1 : 2)} kHz` : `${Math.round(v)} Hz`;
    case 'st': return `${v > 0 ? '+' : ''}${v} st`;
    case 'ct': return `${v > 0 ? '+' : ''}${v} ct`;
    case '%':  return `${Math.round(v * 100)}%`;
    case 'dB': return `${v > 0.05 ? '+' : ''}${v.toFixed(1)} dB`;
    default:   return String(v);
  }
}

  <script>
// ============================================================================
//  E-Piano synth DSP engine (runs inside an AudioWorklet). Mirrors vst/Source/SynthEngine.h.
//
//  This whole function is stringified and loaded as the worklet module via a
//  Blob URL (works from file:// with no server), so it must not reference
//  anything defined outside of it.
//
//  The structure mirrors the planned C++ / JUCE port 1:1:
//    Oscillator     -> PolyBLEP oscillator (sine / saw / square / triangle)
//    Envelope       -> linear attack, exponential decay/release ADSR
//    SVF            -> TPT state-variable low-pass (Cytomic / Simper)
//    Voice          -> 3 oscillators + filter + amp env + filter env
//    SynthProcessor -> 88-voice allocator, MIDI handling, render loop
//                      (== juce::AudioProcessor::processBlock)
// ============================================================================
function synthWorkletModule() {
  'use strict';

  const NUM_VOICES = 88;
  const VOICE_GAIN = 0.16;        // per-voice headroom
  const PITCH_BEND_RANGE = 2;     // semitones
  const SILENCE = 1e-4;           // -80 dB: envelope considered finished
  const TWO_PI = Math.PI * 2;
  const LN_1000 = Math.log(1000); // times are "time to fall 60 dB"

  const OSC_KEYS = [1, 2, 3].map(n => ({
    on: `osc${n}On`, wave: `osc${n}Wave`, pitch: `osc${n}Pitch`,
    fine: `osc${n}Fine`, level: `osc${n}Level`,
  }));

  function expCoef(seconds, sr) {
    return Math.exp(-LN_1000 / (Math.max(seconds, 0.0005) * sr));
  }

  // --- PolyBLEP residual for band-limited discontinuities -------------------
  function polyBlep(t, dt) {
    if (t < dt) { t /= dt; return t + t - t * t - 1; }
    if (t > 1 - dt) { t = (t - 1) / dt; return t * t + t + t + 1; }
    return 0;
  }

  // --- Oscillator -----------------------------------------------------------
  class Oscillator {
    constructor() { this.phase = 0; }
    reset(phase) { this.phase = phase; }
    next(wave, dt) {
      const t = this.phase;
      let y;
      switch (wave) {
        case 1: // saw
          y = 2 * t - 1 - polyBlep(t, dt);
          break;
        case 2: { // square
          let t2 = t + 0.5; if (t2 >= 1) t2 -= 1;
          y = (t < 0.5 ? 1 : -1) + polyBlep(t, dt) - polyBlep(t2, dt);
          break;
        }
        case 3: { // triangle (phase-shifted so it starts at 0)
          let t3 = t + 0.25; if (t3 >= 1) t3 -= 1;
          y = 1 - 4 * Math.abs(t3 - 0.5);
          break;
        }
        default: // sine
          y = Math.sin(TWO_PI * t);
      }
      let p = t + dt; if (p >= 1) p -= 1;
      this.phase = p;
      return y;
    }
  }

  // --- ADSR -----------------------------------------------------------------
  // stage: 0 idle, 1 attack, 2 decay, 3 sustain, 4 release
  class Envelope {
    constructor() { this.stage = 0; this.level = 0; }
    gateOn() { this.stage = 1; }               // attack from current level (no click on retrigger)
    gateOff() { if (this.stage !== 0) this.stage = 4; }
    kill() { this.stage = 0; this.level = 0; }
    next(c) {
      switch (this.stage) {
        case 1:
          this.level += c.atkInc;
          if (this.level >= 1) { this.level = 1; this.stage = 2; }
          break;
        case 2:
          this.level = c.sus + (this.level - c.sus) * c.decCoef;
          if (Math.abs(this.level - c.sus) < SILENCE) {
            this.level = c.sus;
            this.stage = c.sus < SILENCE ? 0 : 3;
          }
          break;
        case 3:
          this.level += (c.sus - this.level) * 0.002; // smooth sustain-knob moves
          if (c.sus < SILENCE && this.level < SILENCE) { this.level = 0; this.stage = 0; }
          break;
        case 4:
          this.level *= c.relCoef;
          if (this.level < SILENCE) { this.level = 0; this.stage = 0; }
          break;
      }
      return this.level;
    }
  }

  // --- TPT state-variable filter (low-pass out) -----------------------------
  class SVF {
    constructor() { this.ic1 = 0; this.ic2 = 0; this.a1 = 1; this.a2 = 0; this.a3 = 0; }
    reset() { this.ic1 = 0; this.ic2 = 0; }
    set(fc, reso, sr) {
      fc = Math.min(Math.max(fc, 20), sr * 0.45);
      const g = Math.tan(Math.PI * fc / sr);
      const k = 2 - 1.9 * reso; // Q 0.5 .. 10
      this.a1 = 1 / (1 + g * (g + k));
      this.a2 = g * this.a1;
      this.a3 = g * this.a2;
    }
    process(x) {
      const v3 = x - this.ic2;
      const v1 = this.a1 * this.ic1 + this.a2 * v3;
      const v2 = this.ic2 + this.a2 * this.ic1 + this.a3 * v3;
      this.ic1 = 2 * v1 - this.ic1;
      this.ic2 = 2 * v2 - this.ic2;
      return v2;
    }
  }

  // --- Voice ----------------------------------------------------------------
  class Voice {
    constructor() {
      this.osc = [new Oscillator(), new Oscillator(), new Oscillator()];
      this.env = new Envelope();
      this.filter = new SVF();
      this.note = -1;
      this.velocity = 0;
      this.velGain = 0;
      this.fEnv = 0;
      this.age = 0;
      this.held = false;      // key physically down
      this.sustained = false; // key up but held by sustain pedal
    }
    isActive() { return this.env.stage !== 0; }
    start(note, vel, age, oscCfg) {
      if (!this.isActive()) {
        // Fresh voice: sine/tri start at phase 0 (clean attack),
        // saw/square get random phase (wider, less "phasey" stacks).
        for (let k = 0; k < 3; k++) {
          const w = oscCfg[k].wave;
          this.osc[k].reset(w === 1 || w === 2 ? Math.random() : 0);
        }
        this.filter.reset();
      }
      this.note = note;
      this.velocity = vel;
      const v = vel / 127;
      this.velGain = 0.1 + 0.9 * Math.pow(v, 1.5);
      this.age = age;
      this.held = true;
      this.sustained = false;
      this.fEnv = 1;
      this.env.gateOn();
    }
    release() {
      this.held = false;
      this.sustained = false;
      this.env.gateOff();
    }
  }

  // --- Processor ------------------------------------------------------------
  class SynthProcessor extends AudioWorkletProcessor {
    constructor(options) {
      super();
      const init = (options && options.processorOptions && options.processorOptions.params) || {};
      this.p = Object.assign({}, init);
      this.voices = Array.from({ length: NUM_VOICES }, () => new Voice());
      this.ageCounter = 0;
      this.sustainPedal = false;
      this.bend = 0;
      this.masterGain = this.p.master !== undefined ? this.p.master : 0.7;
      this.masterSmooth = 1 - Math.exp(-1 / (0.02 * sampleRate));
      this.envc = { atkInc: 0, decCoef: 0, sus: 0, relCoef: 0 };
      this.oscCfg = OSC_KEYS.map(() => ({ on: false, wave: 0, semis: 0, level: 0 }));
      this.fEnvBlockCoef = 0;
      this.blockCount = 0;
      this.peak = 0;
      this.dt = new Float64Array(3);
      this.updateBlockParams(128);
      this.port.onmessage = (e) => this.onMessage(e.data);
    }

    onMessage(m) {
      switch (m.type) {
        case 'param':   this.p[m.id] = m.value; break;
        case 'params':  Object.assign(this.p, m.values); break;
        case 'noteOn':  if (m.vel > 0) this.noteOn(m.note, m.vel); else this.noteOff(m.note); break;
        case 'noteOff': this.noteOff(m.note); break;
        case 'sustain': this.setSustain(!!m.on); break;
        case 'bend':    this.bend = m.value; break;
        case 'allNotesOff':
          this.sustainPedal = false;
          for (const v of this.voices) if (v.isActive()) v.release();
          break;
        case 'panic':
          this.sustainPedal = false;
          for (const v of this.voices) { v.env.kill(); v.held = v.sustained = false; v.filter.reset(); }
          break;
      }
    }

    noteOn(note, vel) {
      let v = null;
      // 1) same note already sounding -> retrigger it
      for (const x of this.voices) if (x.isActive() && x.note === note) { v = x; break; }
      // 2) a free voice
      if (!v) for (const x of this.voices) if (!x.isActive()) { v = x; break; }
      // 3) steal: oldest releasing voice, else oldest voice
      if (!v) {
        for (const x of this.voices) {
          if (!v) { v = x; continue; }
          const xr = x.env.stage === 4, vr = v.env.stage === 4;
          if ((xr && !vr) || (xr === vr && x.age < v.age)) v = x;
        }
      }
      v.start(note, vel, ++this.ageCounter, this.oscCfg);
    }

    noteOff(note) {
      for (const v of this.voices) {
        if (v.note === note && v.held && v.isActive()) {
          if (this.sustainPedal) { v.held = false; v.sustained = true; }
          else v.release();
        }
      }
    }

    setSustain(on) {
      this.sustainPedal = on;
      if (!on) for (const v of this.voices) if (v.sustained) v.release();
    }

    updateBlockParams(n) {
      const p = this.p, sr = sampleRate, e = this.envc;
      e.atkInc = 1 / (Math.max(p.ampAttack, 0.0005) * sr);
      e.decCoef = expCoef(p.ampDecay, sr);
      e.sus = p.ampSustain;
      e.relCoef = expCoef(p.ampRelease, sr);
      this.fEnvBlockCoef = Math.pow(expCoef(p.fltDecay, sr), n);
      for (let k = 0; k < 3; k++) {
        const c = this.oscCfg[k], K = OSC_KEYS[k];
        c.on = p[K.on] >= 0.5;
        c.wave = p[K.wave] | 0;
        c.semis = p[K.pitch] + p[K.fine] / 100;
        c.level = c.on ? p[K.level] : 0;
      }
    }

    renderVoice(v, out, n) {
      const sr = sampleRate, p = this.p, cfg = this.oscCfg, dt = this.dt;
      const base = v.note - 69 + this.bend * PITCH_BEND_RANGE;
      for (let k = 0; k < 3; k++) {
        dt[k] = Math.min(440 * Math.pow(2, (base + cfg[k].semis) / 12) / sr, 0.45);
      }

      // Filter: cutoff * envelope (velocity-scaled) * half key-tracking
      const velN = v.velocity / 127;
      const envOct = p.fltEnvAmt * 7 * v.fEnv * (0.35 + 0.65 * velN);
      const keyOct = (v.note - 60) / 24;
      v.filter.set(p.fltCutoff * Math.pow(2, envOct + keyOct), p.fltReso, sr);
      v.fEnv *= this.fEnvBlockCoef;

      const amp = VOICE_GAIN * v.velGain;
      const [o0, o1, o2] = v.osc;
      const l0 = cfg[0].level, l1 = cfg[1].level, l2 = cfg[2].level;
      const w0 = cfg[0].wave, w1 = cfg[1].wave, w2 = cfg[2].wave;
      const d0 = dt[0], d1 = dt[1], d2 = dt[2];
      const env = v.env, envc = this.envc, filt = v.filter;

      for (let i = 0; i < n; i++) {
        let s = 0;
        if (l0 > 0) s += l0 * o0.next(w0, d0);
        if (l1 > 0) s += l1 * o1.next(w1, d1);
        if (l2 > 0) s += l2 * o2.next(w2, d2);
        s = filt.process(s);
        out[i] += s * env.next(envc) * amp;
        if (env.stage === 0) break;
      }
      if (env.stage === 0) { filt.reset(); v.held = v.sustained = false; }
    }

    process(inputs, outputs) {
      const out = outputs[0];
      const L = out[0];
      if (!L) return true;
      const R = out.length > 1 ? out[1] : null;
      const n = L.length;
      L.fill(0);

      this.updateBlockParams(n);
      let active = 0;
      for (const v of this.voices) {
        if (v.isActive()) { active++; this.renderVoice(v, L, n); }
      }

      // Master gain (smoothed) + soft clip
      const target = this.p.master * Math.pow(10, (this.p.ampLevel || 0) / 20), k = this.masterSmooth; // master * Amp level
      let g = this.masterGain, peak = this.peak;
      for (let i = 0; i < n; i++) {
        g += (target - g) * k;
        const y = Math.tanh(L[i] * g);
        L[i] = y;
        const a = y < 0 ? -y : y;
        if (a > peak) peak = a;
      }
      this.masterGain = g;
      this.peak = peak;
      if (R) R.set(L);

      if (++this.blockCount >= 16) { // ~43 ms @ 48k
        this.port.postMessage({ type: 'stats', voices: active, peak: this.peak });
        this.blockCount = 0;
        this.peak = 0;
      }
      return true;
    }
  }

  registerProcessor('epiano-synth', SynthProcessor);
}

// ============================================================================
//  Engine bridge. The UI only ever talks to this interface:
//     start(), resume(), setParam(id, v), setParams(obj), noteOn(n, vel),
//     noteOff(n), sustain(on), pitchBend(-1..1), allNotesOff(), panic(),
//     onStats(cb), onState(cb)
//  In the VST3 port this class is replaced by a JuceEngine with the same calls.
//
//  Audio path: AudioWorklet when the browser allows it. When the page is opened
//  straight from disk (file://, origin "null") Chrome/Edge refuse to load the
//  worklet module, so we fall back to a ScriptProcessorNode running the exact
//  same DSP code (synthWorkletModule) on the main thread.
// ============================================================================
'use strict';

class WebAudioEngine {
  constructor(initialValues) {
    this.values = Object.assign({}, initialValues);
    this.ctx = null;
    this.port = null;      // { postMessage(msg) } into the DSP
    this.node = null;
    this.mode = '';        // 'AudioWorklet' | 'ScriptProcessor'
    this.ready = false;
    this.starting = null;
    this.onStats = null;
    this.onState = null;   // called when the AudioContext state changes
  }

  // Creates the audio graph. Safe to call without a user gesture: the context
  // just starts out 'suspended' until resume() is called from a click/key.
  start() {
    if (this.ready) return Promise.resolve();
    if (this.starting) return this.starting;
    this.starting = (async () => {
      const ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
      ctx.onstatechange = () => { if (this.onState) this.onState(ctx.state); };
      this.ctx = ctx;
      const src = `(${synthWorkletModule.toString()})();`;

      let built = null;
      if (ctx.audioWorklet && window.location.protocol !== 'file:') {
        try { built = await this.createWorkletNode(ctx, src); }
        catch (err) { console.warn('AudioWorklet unavailable, using ScriptProcessor fallback:', err); }
      }
      if (!built) built = this.createScriptNode(ctx, src);

      this.node = built.node;
      this.port = built.port;
      this.mode = built.mode;
      this.node.connect(ctx.destination);
      this.ready = true;
      if (this.onState) this.onState(ctx.state);
    })();
    this.starting.catch(() => { this.starting = null; });
    return this.starting;
  }

  async createWorkletNode(ctx, src) {
    const url = URL.createObjectURL(new Blob([src], { type: 'application/javascript' }));
    try {
      await ctx.audioWorklet.addModule(url);
    } finally {
      URL.revokeObjectURL(url);
    }
    const node = new AudioWorkletNode(ctx, 'epiano-synth', {
      numberOfInputs: 0,
      numberOfOutputs: 1,
      outputChannelCount: [2],
      processorOptions: { params: this.values },
    });
    node.port.onmessage = (e) => this.handleMessage(e.data);
    return { node, port: node.port, mode: 'AudioWorklet' };
  }

  createScriptNode(ctx, src) {
    // Run the worklet module with stand-ins for the AudioWorklet globals.
    const sink = (m) => this.handleMessage(m);
    class AudioWorkletProcessorShim {
      constructor() { this.port = { postMessage: sink, onmessage: null }; }
    }
    let Processor = null;
    const register = (name, cls) => { Processor = cls; };
    new Function('AudioWorkletProcessor', 'registerProcessor', 'sampleRate', src)(
      AudioWorkletProcessorShim, register, ctx.sampleRate);
    const proc = new Processor({ processorOptions: { params: this.values } });

    const BLOCK = 128;
    const L128 = new Float32Array(BLOCK), R128 = new Float32Array(BLOCK);
    const node = ctx.createScriptProcessor(1024, 0, 2);
    node.onaudioprocess = (e) => {
      const L = e.outputBuffer.getChannelData(0), R = e.outputBuffer.getChannelData(1);
      for (let off = 0; off < L.length; off += BLOCK) {
        proc.process([], [[L128, R128]]);
        L.set(L128, off);
        R.set(R128, off);
      }
    };
    return { node, port: { postMessage: (m) => proc.port.onmessage({ data: m }) }, mode: 'ScriptProcessor' };
  }

  handleMessage(m) {
    if (m.type === 'stats' && this.onStats) this.onStats(m);
  }

  // Must be called from a user gesture (click / key) the first time.
  async resume() {
    await this.start();
    if (this.ctx.state !== 'running') await this.ctx.resume();
  }

  get running() { return !!this.ctx && this.ctx.state === 'running'; }
  get sampleRate() { return this.ctx ? this.ctx.sampleRate : 0; }
  get latencyMs() {
    if (!this.ctx) return 0;
    return ((this.ctx.baseLatency || 0) + (this.ctx.outputLatency || 0)) * 1000;
  }

  post(msg) { if (this.port) this.port.postMessage(msg); }

  setParam(id, value) { this.values[id] = value; this.post({ type: 'param', id, value }); }
  setParams(obj) { Object.assign(this.values, obj); this.post({ type: 'params', values: obj }); }
  noteOn(note, vel) { this.post({ type: 'noteOn', note, vel }); }
  noteOff(note) { this.post({ type: 'noteOff', note }); }
  sustain(on) { this.post({ type: 'sustain', on }); }
  pitchBend(value) { this.post({ type: 'bend', value }); }
  allNotesOff() { this.post({ type: 'allNotesOff' }); }
  panic() { this.post({ type: 'panic' }); }
}

// ============================================================================
//  Web MIDI input. Omni (all channels). Handles note on/off, sustain (CC64),
//  all-notes-off (CC120/123) and pitch bend.
// ============================================================================
'use strict';

class MidiInput {
  constructor(handlers) {
    this.h = handlers;
    this.access = null;
    this.selected = 'all';
  }

  get supported() { return typeof navigator.requestMIDIAccess === 'function'; }

  async init() {
    if (!this.supported) throw new Error('Web MIDI not supported in this browser — use Chrome or Edge.');
    this.access = await navigator.requestMIDIAccess({ sysex: false });
    this.access.onstatechange = () => {
      this.bind();
      if (this.h.devices) this.h.devices(this.inputs());
    };
    this.bind();
    return this.inputs();
  }

  inputs() {
    if (!this.access) return [];
    return Array.from(this.access.inputs.values()).map(i => ({ id: i.id, name: i.name, state: i.state }));
  }

  select(id) { this.selected = id; this.bind(); }

  bind() {
    if (!this.access) return;
    for (const input of this.access.inputs.values()) {
      const listen = this.selected === 'all' || this.selected === input.id;
      input.onmidimessage = listen ? (e) => this.handle(e.data) : null;
    }
  }

  handle(d) {
    const status = d[0];
    if (status >= 0xf0) return; // ignore clock / active sensing / sysex
    const cmd = status & 0xf0, ch = (status & 0x0f) + 1, h = this.h;
    if (cmd === 0x90 && d[2] > 0) h.noteOn(d[1], d[2], ch);
    else if (cmd === 0x80 || cmd === 0x90) h.noteOff(d[1], ch);
    else if (cmd === 0xb0) {
      if (d[1] === 64) h.sustain(d[2] >= 64, ch);
      else if (d[1] === 120 || d[1] === 123) h.allNotesOff(ch);
    } else if (cmd === 0xe0) {
      h.bend((((d[2] << 7) | d[1]) - 8192) / 8192, ch);
    }
    if (h.message) h.message(d, ch);
  }
}

// ============================================================================
//  SVG rotary knob.
//  Drag up/down (Shift = fine), mouse wheel, arrow keys, double-click = default.
//  270° sweep. Bipolar params draw their arc from 12 o'clock.
// ============================================================================
'use strict';

const KNOB_SWEEP = 135; // degrees either side of 12 o'clock

function svgPolar(cx, cy, r, deg) {
  const a = (deg - 90) * Math.PI / 180;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}

function svgArc(cx, cy, r, a0, a1) {
  if (Math.abs(a1 - a0) < 0.5) return '';
  const lo = Math.min(a0, a1), hi = Math.max(a0, a1);
  const [x0, y0] = svgPolar(cx, cy, r, lo);
  const [x1, y1] = svgPolar(cx, cy, r, hi);
  const large = hi - lo > 180 ? 1 : 0;
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}

class Knob {
  // onGesture(true/false) brackets a drag so the DAW records it as one automation gesture.
  constructor(def, value, onChange, onGesture) {
    this.def = def;
    this.onChange = onChange;
    this.onGesture = onGesture || null;
    this.value = value;
    this.drag = null;

    const el = document.createElement('div');
    el.className = 'knob';
    let ticks = '';
    if (def.type === 'choice') {
      const steps = def.max - def.min;
      for (let i = 0; i <= steps; i++) {
        const [x, y] = svgPolar(32, 32, 31, -KNOB_SWEEP + (2 * KNOB_SWEEP * i) / steps);
        ticks += `<circle class="k-tick" cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="1.4"/>`;
      }
    }
    el.innerHTML = `
      <svg class="knob-svg" viewBox="0 0 64 64" tabindex="0" role="slider"
           aria-label="${def.name}" aria-valuemin="${def.min}" aria-valuemax="${def.max}">
        <path class="k-track" d="${svgArc(32, 32, 26, -KNOB_SWEEP, KNOB_SWEEP)}"/>
        ${ticks}
        <path class="k-value" d=""/>
        <circle class="k-face" cx="32" cy="32" r="19"/>
        <g class="k-rot"><line class="k-pointer" x1="32" y1="24" x2="32" y2="15"/></g>
      </svg>
      <div class="knob-value"></div>
      <div class="knob-label">${def.name}</div>`;
    this.el = el;
    this.svg = el.querySelector('svg');
    this.valuePath = el.querySelector('.k-value');
    this.rot = el.querySelector('.k-rot');
    this.readout = el.querySelector('.knob-value');
    this.bindEvents();
    this.render();
  }

  get norm() { return paramToNorm(this.def, this.value); }

  setValue(v, notify = false) {
    v = clamp(v, this.def.min, this.def.max);
    if (v === this.value) return;
    this.value = v;
    this.render();
    if (notify && this.onChange) this.onChange(v);
  }

  setNorm(n) { this.setValue(paramFromNorm(this.def, n), true); }

  nudge(dir, fine) {
    const d = this.def;
    if (d.step) this.setValue(this.value + dir * d.step, true);
    else this.setNorm(this.norm + dir * (fine ? 0.002 : 0.01));
  }

  render() {
    const d = this.def;
    const angle = -KNOB_SWEEP + this.norm * 2 * KNOB_SWEEP;
    const startAngle = d.bipolar ? 0 : -KNOB_SWEEP;
    this.valuePath.setAttribute('d', svgArc(32, 32, 26, startAngle, angle));
    this.rot.setAttribute('transform', `rotate(${angle.toFixed(2)} 32 32)`);
    this.readout.textContent = formatParam(d, this.value);
    this.svg.setAttribute('aria-valuenow', String(this.value));
    this.svg.setAttribute('aria-valuetext', formatParam(d, this.value));
  }

  bindEvents() {
    const svg = this.svg;
    svg.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      svg.setPointerCapture(e.pointerId);
      svg.focus();
      this.drag = { y: e.clientY, norm: this.norm };
      this.el.classList.add('active');
      if (this.onGesture) this.onGesture(true);
    });
    svg.addEventListener('pointermove', (e) => {
      if (!this.drag) return;
      const dy = this.drag.y - e.clientY;
      this.drag.y = e.clientY;
      this.drag.norm = clamp(this.drag.norm + dy * (e.shiftKey ? 0.001 : 0.005), 0, 1);
      this.setNorm(this.drag.norm);
    });
    const end = () => {
      if (!this.drag) return;
      this.drag = null;
      this.el.classList.remove('active');
      if (this.onGesture) this.onGesture(false);
    };

    svg.addEventListener('pointercancel', end);

    svg.addEventListener('wheel', (e) => {

      if (dir) { e.preventDefault(); e.stopPropagation(); this.nudge(dir, e.shiftKey); }

  }
}

// ============================================================================
//  24-key SVG piano. Inverted colours: naturals are black, sharps are white.
//  Click/touch to play, drag for glissando. Velocity = how far down the key
//  you click (lower = harder), like striking nearer the front edge.

'use strict';

const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const BLACK_PCS = new Set([1, 3, 6, 8, 10]);

class Piano {
  constructor(container, { numKeys = 24, baseNote = 48, onNoteOn, onNoteOff }) {

    this.onNoteOn = onNoteOn;

      const cur = this.pointers.get(e.pointerId);
      const next = h ? h.note : null;
      if (next === cur) return;
      if (cur !== null) this.onNoteOff(cur);
      this.pointers.set(e.pointerId, next);

    x += tw(d); p.push(`L${x.toFixed(1)},${ys.toFixed(1)}`);
    x = w - pad - tw(r); p.push(`L${x.toFixed(1)},${ys.toFixed(1)}`);
    p.push(`L${w - pad},${bot}`);
    return p.join(' ');
  }

      const db = clamp(20 * Math.log10(mag), -36, 24);
      const y = 6 + (24 - db) / 60 * (h - 10);
      pts.push(`${(i / N * w).toFixed(1)},${y.toFixed(1)}`);
    }
    return 'M' + pts.join(' L');
  }

  function makeScreen(parent) {
    const s = el('div', 'screen', `
      <svg viewBox="0 0 200 48" preserveAspectRatio="none"><path class="scr-grid" d="M0 24 H200"/><path class="scr-line" d=""/></svg>
      <div class="scr-text"></div>`);
    parent.appendChild(s);
    return { path: s.querySelector('.scr-line'), text: s.querySelector('.scr-text'), root: s };
  }

  function refreshScreens(group) {
    for (let n = 1; n <= 3; n++) {
      const g = `osc${n}`;
      if (group && group !== g) continue;
      const scr = screens[g], on = values[`${g}On`] >= 0.5, w = values[`${g}Wave`] | 0;
      scr.path.setAttribute('d', wavePath(w, 200, 48));
      scr.text.textContent = on
        ? `${WAVE_NAMES[w].toUpperCase()}  ${formatParam(PARAM_BY_ID[`${g}Pitch`], values[`${g}Pitch`])}  ${formatParam(PARAM_BY_ID[`${g}Fine`], values[`${g}Fine`])}`
        : 'OFF';
      scr.root.closest('.panel').classList.toggle('off', !on);
    }
    if (!group || group === 'amp') {
      screens.amp.path.setAttribute('d', adsrPath(values.ampAttack, values.ampDecay, values.ampSustain, values.ampRelease, 200, 48));
    }
    if (!group || group === 'filter') {
      screens.filter.path.setAttribute('d', filterPath(values.fltCutoff, values.fltReso, 200, 48));
      screens.filter.text.textContent = `LP12  ${formatParam(PARAM_BY_ID.fltCutoff, values.fltCutoff)}`;
    }
  }

  // ------------------------------------------------------------- panels ----
  function addKnob(row, id) {
    const k = new Knob(PARAM_BY_ID[id], values[id], (v) => setParam(id, v, true));
    knobs[id] = k;
    row.appendChild(k.el);
  }

  function makePanel(title, extraHeader) {
    const p = el('div', 'panel');
    const h = el('div', 'panel-head', `<span class="panel-title">${title}</span>`);
    if (extraHeader) h.appendChild(extraHeader);
    p.appendChild(h);
    return p;
  }

  const oscRow = $('#osc-row');
  for (let n = 1; n <= 3; n++) {
    const id = `osc${n}On`;
    const btn = el('button', 'power', '<span class="led"></span><span>ON</span>');
    btn.type = 'button';
    btn.setAttribute('aria-label', `Oscillator ${n} on/off`);
    btn.addEventListener('click', () => setParam(id, values[id] >= 0.5 ? 0 : 1));
    toggles[id] = (v) => { btn.classList.toggle('on', v >= 0.5); btn.setAttribute('aria-pressed', v >= 0.5); };
    toggles[id](values[id]);

    const panel = makePanel(`OSC ${n}`, btn);
    screens[`osc${n}`] = makeScreen(panel);
    const row = el('div', 'knob-row');
    ['Wave', 'Pitch', 'Fine', 'Level'].forEach(f => addKnob(row, `osc${n}${f}`));
    panel.appendChild(row);
    oscRow.appendChild(panel);
  }

  const modRow = $('#mod-row');
  {
    const amp = makePanel('AMP ENVELOPE');
    screens.amp = makeScreen(amp);
    screens.amp.text.textContent = 'ADSR';
    const row = el('div', 'knob-row');
    ['ampAttack', 'ampDecay', 'ampSustain', 'ampRelease', 'ampLevel'].forEach(id => addKnob(row, id));
    amp.appendChild(row);
    modRow.appendChild(amp);

    const flt = makePanel('FILTER');
    screens.filter = makeScreen(flt);
    const frow = el('div', 'knob-row');
    ['fltCutoff', 'fltReso', 'fltEnvAmt', 'fltDecay'].forEach(id => addKnob(frow, id));
    flt.appendChild(frow);
    modRow.appendChild(flt);

    const out = makePanel('OUTPUT');
    out.classList.add('output-panel');
    out.appendChild(el('div', 'screen voice-screen', `
      <div class="vs-row"><span class="vs-label">VOICES</span><span class="vs-value"><b id="voice-count">0</b>/${NUM_VOICES}</span></div>
      <div class="meter"><div id="meter-fill"></div><div class="meter-clip"></div></div>`));
    const orow = el('div', 'knob-row');
    addKnob(orow, 'master');
    out.appendChild(orow);
    modRow.appendChild(out);
  }

  // ---------------------------------------------------------- notes / UI ---
  const monitor = $('#midi-monitor');
  const midiLed = $('#midi-led');
  let ledTimer = 0;
  function logMidi(text) { monitor.textContent = text; }
  function flashLed() {
    midiLed.classList.add('on');
    clearTimeout(ledTimer);
    ledTimer = setTimeout(() => midiLed.classList.remove('on'), 90);
  }

  const piano = new Piano($('#piano'), {
    numKeys: 24,
    baseNote: 48,
    onNoteOn: (n, v) => noteOn(n, v, 'mouse'),
    onNoteOff: (n) => noteOff(n),
  });

  function noteOn(note, vel, src) {
    if (!engine.running) logMidi('Audio is off — click anywhere on the page once to enable it');
    engine.noteOn(note, vel);
    piano.setNote(note, true);
    if (src !== 'midi' && engine.running) logMidi(`${src.toUpperCase()}  NOTE ON   ${midiNoteName(note).padEnd(3)} (${note})  vel ${vel}`);
  }
  function noteOff(note) {
    engine.noteOff(note);
    piano.setNote(note, false);
  }

  function setOctave(base) {
    base = clamp(base, 12, 96);
    for (const [k, n] of heldKeys) { noteOff(n); heldKeys.delete(k); }
    piano.setBase(base);
    $('#octave-readout').textContent = `${midiNoteName(base)}–${midiNoteName(base + 23)}`;
  }
  $('#oct-down').addEventListener('click', () => setOctave(piano.base - 12));
  $('#oct-up').addEventListener('click', () => setOctave(piano.base + 12));

  // Computer keyboard: two rows, A = C
  const KEYMAP = { a: 0, w: 1, s: 2, e: 3, d: 4, f: 5, t: 6, g: 7, y: 8, h: 9, u: 10, j: 11,
                   k: 12, o: 13, l: 14, p: 15, ';': 16, "'": 17 };
  const heldKeys = new Map();
  window.addEventListener('keydown', (e) => {
    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) || !modal.classList.contains('hidden')) return;
    const key = e.key.toLowerCase();
    if (key === 'z') { setOctave(piano.base - 12); return; }
    if (key === 'x') { setOctave(piano.base + 12); return; }
    if (key in KEYMAP && !heldKeys.has(key)) {
      const note = piano.base + KEYMAP[key];
      heldKeys.set(key, note);
      noteOn(note, 100, 'kbd');
    }
  });
  window.addEventListener('keyup', (e) => {
    const key = e.key.toLowerCase();
    if (heldKeys.has(key)) { noteOff(heldKeys.get(key)); heldKeys.delete(key); }
  });
  window.addEventListener('blur', () => {
    for (const [, n] of heldKeys) noteOff(n);
    heldKeys.clear();
  });

  $('#panic-btn').addEventListener('click', () => {
    engine.panic();
    piano.clear();
    heldKeys.clear();
    $('#sustain-led').classList.remove('on');
    logMidi('PANIC — all voices killed');
  });

  // ------------------------------------------------------------- stats -----
  const meterFill = $('#meter-fill');
  const meterClip = document.querySelector('.meter-clip');
  let clipTimer = 0;
  engine.onStats = ({ voices, peak }) => {
    $('#voice-count').textContent = voices;
    const db = 20 * Math.log10(Math.max(peak, 1e-5));
    meterFill.style.width = `${clamp((db + 60) / 60, 0, 1) * 100}%`;
    if (peak > 0.95) {
      meterClip.classList.add('on');
      clearTimeout(clipTimer);
      clipTimer = setTimeout(() => meterClip.classList.remove('on'), 800);
    }
  };

  // -------------------------------------------------------------- MIDI -----
  const midi = new MidiInput({
    noteOn: (n, v, ch) => {
      noteOn(n, v, 'midi');
      if (engine.running) logMidi(`MIDI  ch${ch}  NOTE ON   ${midiNoteName(n).padEnd(3)} (${n})  vel ${v}`);
    },
    noteOff: (n, ch) => { noteOff(n); logMidi(`MIDI  ch${ch}  NOTE OFF  ${midiNoteName(n).padEnd(3)} (${n})`); },
    sustain: (on, ch) => {
      engine.sustain(on);
      $('#sustain-led').classList.toggle('on', on);
      logMidi(`MIDI  ch${ch}  SUSTAIN ${on ? 'DOWN' : 'UP'}`);
    },
    bend: (v, ch) => { engine.pitchBend(v); logMidi(`MIDI  ch${ch}  PITCH BEND ${v.toFixed(3)}`); },
    allNotesOff: (ch) => { engine.allNotesOff(); piano.clear(); logMidi(`MIDI  ch${ch}  ALL NOTES OFF`); },
    message: () => flashLed(),
    devices: (list) => fillMidiSelect(list),
  });

  const midiSelect = $('#midi-select');
  function fillMidiSelect(list) {
    const cur = midiSelect.value || 'all';
    midiSelect.innerHTML = '';
    midiSelect.appendChild(new Option(list.length ? `All inputs (${list.length})` : 'No MIDI devices', 'all'));
    list.forEach(d => midiSelect.appendChild(new Option(d.name + (d.state === 'connected' ? '' : ' (off)'), d.id)));
    midiSelect.value = Array.from(midiSelect.options).some(o => o.value === cur) ? cur : 'all';
  }
  midiSelect.addEventListener('change', () => midi.select(midiSelect.value));

  midi.init()
    .then((list) => logMidi(list.length
      ? `MIDI ready — ${list.length} input(s): ${list.map(d => d.name).join(', ')}`
      : 'MIDI ready — no devices found (plug one in, it will appear automatically)'))
    .then(() => fillMidiSelect(midi.inputs()))
    .catch((err) => {
      midiSelect.innerHTML = '<option>MIDI unavailable</option>';
      midiSelect.disabled = true;
      logMidi(`MIDI unavailable: ${err.message || err}`);
    });

  // ------------------------------------------------------------- audio -----
  // The graph is built on load; browsers let it make sound after the first
  // click or key press anywhere on the page.
  const audioInfo = $('#audio-info');
  const audioLed = $('#audio-led');
  let audioError = null;

  function renderAudioStatus() {
    if (audioError) {
      audioInfo.textContent = `Audio error: ${audioError}`;
      audioLed.classList.remove('on');
    } else if (engine.running) {
      audioInfo.textContent = `${engine.mode} · ${(engine.sampleRate / 1000).toFixed(1)} kHz · ~${engine.latencyMs.toFixed(1)} ms`;
      audioLed.classList.add('on');
    } else {
      audioInfo.textContent = 'Click anywhere to enable audio';
      audioLed.classList.remove('on');
    }
  }
  engine.onState = renderAudioStatus;

  function reportAudioError(err) {
    audioError = err.message || String(err);
    console.error(err);
    renderAudioStatus();
  }
  function unlockAudio() {
    if (!engine.running) engine.resume().then(renderAudioStatus).catch(reportAudioError);
  }
  document.addEventListener('pointerdown', unlockAudio, true);
  document.addEventListener('keydown', unlockAudio, true);
  engine.start().then(renderAudioStatus).catch(reportAudioError);

  // -------------------------------------------------------------- init -----
  renderPresetName();
  renderBrowser();
  renderFolderButton();
  refreshScreens();
  setOctave(48);
})();
  </script>
</body>
</html>
