<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>E-Piano v1.0.0</title>
  <style>
:root {
  --bg: #0a0b0d;
  --chassis-1: #1b1d21;
  --chassis-2: #121417;
  --panel: #16181c;
  --panel-edge: #262a30;
  --screen: #07080a;
  --text: #e6e7ea;
  --muted: #8a9099;
  --faint: #4a4f57;
  --accent: #ff8a3d;
  --accent-glow: rgba(255, 138, 61, 0.45);
  --accent-dim: #5a3118;
  --track: #2a2e35;
  --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Cascadia Mono", "Consolas", ui-monospace, monospace;
}

* { box-sizing: border-box; }

html, body { margin: 0; }
body {
  min-height: 100vh;
  background: radial-gradient(1200px 600px at 50% -10%, #1a1c21 0%, var(--bg) 60%) var(--bg);
  color: var(--text);
  font-family: var(--sans);
  display: flex;
  justify-content: center;
  padding: 24px 16px;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; color: inherit; }

.synth {
  width: 100%;
  min-width: 0;
  max-width: 1080px;
  background: linear-gradient(180deg, var(--chassis-1), var(--chassis-2));
  border: 1px solid var(--panel-edge);
  border-radius: 16px;
  padding: 18px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  display: flex;
  flex-direction: column;
  gap: 14px;
  user-select: none;
}

/* ---------------------------------------------------------------- LEDs --- */
.led {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #2b2420;
  box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.6);
  flex: none;
  transition: background 60ms, box-shadow 60ms;
}
.led.on, .selected > .led, .power.on .led {
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent-glow), 0 0 2px var(--accent);
}

.ctl-label, .panel-title, .knob-label, .pd-label, .vs-label {
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}

/* -------------------------------------------------------------- top bar --- */
.topbar {
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
}
.brand { display: flex; flex-direction: column; line-height: 1.1; }
.brand-mark { font-size: 22px; font-weight: 800; letter-spacing: 0.18em; }
.brand-sub { font-size: 10px; letter-spacing: 0.22em; color: var(--accent); margin-top: 3px; }

.patch-display {
  flex: 1;
  min-width: 200px;
  display: flex;
  align-items: baseline;
  gap: 10px;
  background: var(--screen);
  border: 1px solid #000;
  border-radius: 6px;
  padding: 8px 12px;
  box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.8);
}
.pd-name { font-family: var(--mono); color: var(--accent); font-size: 15px; text-shadow: 0 0 8px var(--accent-glow); }

.top-controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.midi-pick { display: flex; align-items: center; gap: 8px; }
.midi-pick select {
  background: var(--screen);
  color: var(--text);
  border: 1px solid var(--panel-edge);
  border-radius: 5px;
  padding: 5px 8px;
  font: 12px var(--sans);
  max-width: 220px;
}
.indicator { display: flex; align-items: center; gap: 6px; font-size: 10px; letter-spacing: 0.14em; color: var(--muted); font-weight: 600; }

.panic {
  background: #2a1512;
  border: 1px solid #5b2a22;
  color: #ff9c8a;
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 11px;
  letter-spacing: 0.14em;
  font-weight: 700;
  cursor: pointer;
}
.panic:hover { background: #3a1a15; }
.panic:active { transform: translateY(1px); }

/* ----------------------------------------------------------- voice bank --- */
.voice-bank {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 8px;
}
.voice-btn {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  padding: 8px 10px 9px;
  background: linear-gradient(180deg, #23262b, #1a1c20);
  border: 1px solid var(--panel-edge);
  border-radius: 7px;
  cursor: pointer;
  text-align: left;
  box-shadow: 0 2px 0 #0b0c0e;
  transition: border-color 120ms;
}
.voice-btn:hover { border-color: #3a3f47; }
.voice-btn:active { transform: translateY(1px); box-shadow: 0 1px 0 #0b0c0e; }
.voice-btn .led { position: absolute; top: 9px; right: 9px; }
.voice-num { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.voice-name { font-size: 12px; font-weight: 600; line-height: 1.2; }
.voice-btn.selected { border-color: var(--accent-dim); background: linear-gradient(180deg, #2a221d, #1c1916); }
.voice-btn.dirty .voice-name::after { content: " *"; color: var(--accent); }

/* --------------------------------------------------------------- panels --- */
.osc-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.mod-row { display: grid; grid-template-columns: 1fr 1fr 0.55fr; gap: 12px; }

.panel {
  background: var(--panel);
  border: 1px solid var(--panel-edge);
  border-radius: 10px;
  padding: 10px 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
  transition: opacity 150ms;
  min-width: 0;
}
.panel.off .screen, .panel.off .knob-row { opacity: 0.38; }
.panel-head { display: flex; align-items: center; justify-content: space-between; min-height: 22px; }
.panel-title { color: var(--text); }

.power {
  display: flex; align-items: center; gap: 6px;
  background: #1f2226;
  border: 1px solid var(--panel-edge);
  border-radius: 5px;
  padding: 3px 8px;
  font-size: 10px; letter-spacing: 0.14em; font-weight: 700;
  color: var(--muted);
  cursor: pointer;
}
.power.on { color: var(--text); }

.screen {
  position: relative;
  background: var(--screen);
  border: 1px solid #000;
  border-radius: 6px;
  height: 56px;
  overflow: hidden;
  box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.9);
}
.screen svg { position: absolute; inset: 4px 0; width: 100%; height: calc(100% - 8px); }
.scr-grid { stroke: #1a1d22; stroke-width: 1; vector-effect: non-scaling-stroke; }
.scr-line {
  fill: none;
  stroke: var(--accent);
  stroke-width: 1.6;
  vector-effect: non-scaling-stroke;
  filter: drop-shadow(0 0 3px var(--accent-glow));
  stroke-linejoin: round;
}
.scr-text {
  position: absolute; right: 8px; top: 5px;
  font-family: var(--mono); font-size: 10px; color: #c9cdd3;
  background: rgba(7, 8, 10, 0.75);
  padding: 1px 4px; border-radius: 3px;
}

.voice-screen { display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 0 10px; }
.vs-row { display: flex; justify-content: space-between; align-items: baseline; }
.vs-value { font-family: var(--mono); color: var(--muted); font-size: 12px; }
.vs-value b { color: var(--accent); font-size: 16px; font-weight: 600; }
.meter { position: relative; height: 6px; background: #15171a; border-radius: 3px; overflow: hidden; }
#meter-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, #3d8f5a 0%, #b8b23b 75%, #ff5a3d 100%);
  background-size: 100% 100%;
  transition: width 60ms linear;
}
.meter-clip { position: absolute; right: 0; top: 0; width: 6px; height: 100%; background: #3a1512; }
.meter-clip.on { background: #ff3b2f; box-shadow: 0 0 6px #ff3b2f; }

/* ---------------------------------------------------------------- knobs --- */
.knob-row { display: flex; justify-content: space-around; gap: 4px; }
.knob { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 64px; }
.knob-svg { width: 56px; height: 56px; cursor: ns-resize; touch-action: none; outline: none; overflow: visible; }
.knob-svg:focus-visible .k-face { stroke: var(--accent); }
.k-track { fill: none; stroke: var(--track); stroke-width: 4; stroke-linecap: round; }
.k-value { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; filter: drop-shadow(0 0 3px var(--accent-glow)); }
.k-tick { fill: var(--faint); }
.k-face { fill: url(#knobFace); stroke: #050607; stroke-width: 1.5; }
.k-pointer { stroke: #f4f4f4; stroke-width: 2.6; stroke-linecap: round; }
.knob:hover .k-track { stroke: #343941; }
.knob-value { font-family: var(--mono); font-size: 11px; color: var(--text); min-height: 14px; white-space: nowrap; }
.knob.active .knob-value { color: var(--accent); }
.knob-label { font-size: 9px; }

.output-panel .knob-row { flex: 1; align-items: center; }

/* --------------------------------------------------------------- keybed --- */
.keybed {
  display: flex;
  gap: 14px;
  background: #000;
  border: 1px solid #1c1e22;
  border-radius: 12px;
  padding: 12px;
  box-shadow: inset 0 4px 14px rgba(0, 0, 0, 0.9);
}
.octave-ctl {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; width: 92px; flex: none;
}
.oct-buttons { display: flex; gap: 6px; }
.oct-buttons button {
  width: 34px; height: 30px;
  background: #1c1e22; border: 1px solid #30343b; border-radius: 6px;
  font-size: 18px; line-height: 1; cursor: pointer;
}
.oct-buttons button:hover { border-color: var(--accent-dim); }
.oct-buttons button:active { transform: translateY(1px); }
.oct-readout { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.kbd-hint { font-size: 10px; color: var(--faint); text-align: center; line-height: 1.4; }

.piano { flex: 1; min-width: 0; }
.piano-svg { display: block; width: 100%; height: auto; touch-action: none; cursor: pointer; }
.felt { fill: #5a1a17; }

/* Inverted keyboard: naturals black, sharps white */
.wkey { fill: #0c0c0d; stroke: #34363b; stroke-width: 1; transition: fill 40ms; }
.wkey:hover { fill: #17181a; }
.wkey.down { fill: var(--accent); stroke: var(--accent); }
.bkey { fill: #f2f1ee; stroke: #8f8f8f; stroke-width: 1; transition: fill 40ms; }
.bkey:hover { fill: #ffffff; }
.bkey.down { fill: var(--accent); stroke: #b85a20; }
.klabel { fill: #5b6068; font: 600 11px var(--sans); text-anchor: middle; pointer-events: none; }

/* ------------------------------------------------------------ statusbar --- */
.statusbar {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  font-family: var(--mono); font-size: 11px; color: var(--muted);
  padding: 0 4px;
}
.monitor { flex: 1; min-width: 0; white-space: pre; overflow: hidden; text-overflow: ellipsis; }
.audio-status { display: flex; align-items: center; gap: 6px; flex: none; }

/* -------------------------------------------------------------- overlay --- */
.overlay {
  position: fixed; inset: 0; z-index: 10;
  display: flex; align-items: center; justify-content: center;
  background: rgba(5, 6, 8, 0.72);
  backdrop-filter: blur(4px);
}
.overlay.hidden { display: none; }
.overlay-card { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 16px; }
#power-btn {
  width: 96px; height: 96px; border-radius: 50%;
  background: radial-gradient(circle at 40% 30%, #2e3238, #15171a);
  border: 2px solid var(--accent-dim);
  color: var(--accent);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  box-shadow: 0 0 30px rgba(255, 138, 61, 0.15);
  transition: box-shadow 150ms, border-color 150ms;
}
#power-btn:hover { border-color: var(--accent); box-shadow: 0 0 40px var(--accent-glow); }
#power-btn:disabled { opacity: 0.5; cursor: wait; }
.overlay-title { margin: 10px 0 0; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; font-size: 13px; }
.overlay-sub { margin: 0; color: var(--muted); font-size: 13px; max-width: 320px; }
.overlay.hint #power-btn { animation: pulse 0.9s ease-in-out 2; }
@keyframes pulse { 50% { box-shadow: 0 0 60px var(--accent-glow); border-color: var(--accent); } }

/* ----------------------------------------------------------- responsive --- */
@media (max-width: 900px) {
  .voice-bank { grid-template-columns: repeat(4, 1fr); }
  .osc-row, .mod-row { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  body { padding: 12px 8px; }
  .synth { padding: 12px; }
  .voice-bank { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .patch-display { min-width: 0; flex-basis: 100%; }
  .knob { width: 56px; }
  .keybed { flex-direction: column; }
  .octave-ctl { flex-direction: row; width: auto; }
  .kbd-hint { display: none; }
}

/* ===================================================== plugin overrides ===
   The panel is laid out at a fixed design width and scaled (app.js fit())
   to whatever size the plugin window is. */
body.plugin {
  display: block;
  padding: 0;
  height: 100vh;
  overflow: hidden;
  background: var(--bg);
}
body.plugin .synth {
  position: absolute;
  top: 12px;
  left: 50%;
  width: 1080px;
  max-width: none;
  transform-origin: top center;
  transform: translateX(-50%);
}
/* never switch to the narrow layouts inside the plugin */
body.plugin .voice-bank { grid-template-columns: repeat(8, minmax(0, 1fr)); }
body.plugin .osc-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
body.plugin .mod-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 0.55fr); }
body.plugin .keybed { flex-direction: row; }
body.plugin .octave-ctl { flex-direction: column; width: 92px; }
body.plugin .kbd-hint { display: block; }
body.plugin .knob { width: 64px; }

/* ====================================================== compact (phones) ===
   Touch screens too small for the scaled panel (app.js fit()): the panel is
   zoomed to the screen width, the page scrolls, the keybed stays at the bottom. */
body.plugin.compact { height: auto; overflow-x: hidden; overflow-y: auto; }
body.plugin.compact .synth {
  position: relative; top: auto; left: auto;
  transform: none;
  margin: 6px auto 0;
  border-radius: 12px;
  overflow: visible;
}
body.plugin.compact .keybed {
  position: sticky; bottom: 0; z-index: 3;
  box-shadow: inset 0 4px 14px rgba(0, 0, 0, 0.9), 0 -10px 24px rgba(0, 0, 0, 0.75);
}
/* scrolling page: only the active tab takes space (no blank area under short pages) */
body.plugin.compact .page:not(.active) { display: none; }
body.plugin.compact .kbd-hint,
body.plugin.compact .page-hint { display: none; }
/* landscape phone: short, wide keys so the panels above keep some room */
body.plugin.compact:not(.portrait) .piano-svg { height: 150px; }
body.plugin.compact:not(.portrait) .wheel-svg { height: 90px; }

/* portrait: one column, 480 px design width */
body.plugin.compact.portrait .synth { width: 480px; padding: 12px; gap: 12px; }
body.plugin.compact.portrait .topbar { gap: 10px; }
body.plugin.compact.portrait .patch-display { flex-basis: 100%; order: 3; min-width: 0; }
body.plugin.compact.portrait .preset-actions { margin-left: auto; }
body.plugin.compact.portrait .top-controls { order: 4; flex-basis: 100%; justify-content: space-between; gap: 10px; }
body.plugin.compact.portrait .midi-pick select { max-width: 150px; }
body.plugin.compact.portrait .preset-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); height: 102px; }
body.plugin.compact.portrait .page-tab { padding: 7px 10px 6px; letter-spacing: 0.1em; }
body.plugin.compact.portrait .osc-row,
body.plugin.compact.portrait .mod-row,
body.plugin.compact.portrait .modpage-row,
body.plugin.compact.portrait .fxpage-row { grid-template-columns: minmax(0, 1fr); }
/* keybed: octave controls in a row on top, wheel beside full-width keys */
body.plugin.compact.portrait .keybed {
  display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center;
  padding: 8px 10px 10px; gap: 6px 8px;
}
body.plugin.compact.portrait .octave-ctl { grid-row: 1; grid-column: 1 / -1; flex-direction: row; width: auto; gap: 12px; }
body.plugin.compact.portrait .oct-buttons button { width: 44px; height: 30px; }
body.plugin.compact.portrait .wheel-ctl { grid-row: 2; grid-column: 1; width: 30px; }
body.plugin.compact.portrait .piano { grid-row: 2; grid-column: 2; }
body.plugin.compact.portrait .modpage-row,
body.plugin.compact.portrait .fxpage-row { align-content: start; }

/* ======================================================== preset browser === */
.patch-display { align-items: center; gap: 6px; padding: 5px 6px; }
.pd-text { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; padding: 0 4px; }
.pd-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pd-step {
  flex: none; width: 26px; height: 26px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  background: #15171a; border: 1px solid var(--panel-edge); border-radius: 5px; cursor: pointer;
}
.pd-step svg { width: 12px; height: 12px; fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.pd-step:hover svg { stroke: var(--accent); }
.pd-step:active { transform: translateY(1px); }

.preset-actions { display: flex; gap: 6px; }
.pd-btn {
  background: linear-gradient(180deg, #24272c, #1b1d21);
  border: 1px solid var(--panel-edge);
  border-radius: 6px;
  padding: 6px 11px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
  color: var(--text);
  cursor: pointer;
}
.pd-btn:hover { border-color: #3a3f47; }
.pd-btn:active { transform: translateY(1px); }
.pd-btn.primary { background: linear-gradient(180deg, #3a2618, #2a1c13); border-color: var(--accent-dim); color: var(--accent); }
.pd-btn.primary:hover { border-color: var(--accent); }
.pd-btn.danger { background: #2a1512; border-color: #5b2a22; color: #ff9c8a; }

.browser {
  background: var(--panel);
  border: 1px solid var(--panel-edge);
  border-radius: 10px;
  padding: 8px;
  display: flex; flex-direction: column; gap: 8px;
}
.cat-tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.cat-tab {
  position: relative;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 5px;
  padding: 4px 10px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--muted);
  cursor: pointer;
}
.cat-tab:hover { color: var(--text); }
.cat-tab.active { color: var(--accent); border-color: var(--accent-dim); background: #221a14; }
.cat-tab.has-current::after {
  content: ""; position: absolute; top: 3px; right: 3px;
  width: 4px; height: 4px; border-radius: 50%; background: var(--accent);
}

.preset-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  grid-auto-rows: 30px;
  gap: 6px;
  height: 66px;            /* two rows; user folders with more scroll */
  overflow-y: auto;
  padding-right: 2px;
}
.preset-btn {
  position: relative;
  display: flex; align-items: center;
  padding: 0 24px 0 10px;
  background: linear-gradient(180deg, #23262b, #1a1c20);
  border: 1px solid var(--panel-edge);
  border-radius: 6px;
  font-size: 12px; font-weight: 600; text-align: left;
  cursor: pointer;
  min-width: 0;
}
.preset-btn:hover { border-color: #3a3f47; }
.preset-btn:active { transform: translateY(1px); }
.preset-btn.selected { border-color: var(--accent); background: linear-gradient(180deg, #2c221b, #1d1916); color: var(--accent); }
.pb-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pb-del {
  position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
  width: 18px; height: 18px; line-height: 17px; text-align: center;
  border-radius: 4px; color: var(--muted); font-size: 14px;
  opacity: 0;
}
.preset-btn:hover .pb-del { opacity: 1; }
.pb-del:hover { background: #3a1a15; color: #ff9c8a; }
.grid-empty { grid-column: 1 / -1; grid-row: 1 / 3; align-self: center; font-size: 12px; color: var(--muted); line-height: 1.6; padding: 0 4px; }
.path { font-family: var(--mono); color: var(--text); font-size: 11px; word-break: break-all; }

.preset-grid::-webkit-scrollbar { width: 6px; }
.preset-grid::-webkit-scrollbar-thumb { background: #30343b; border-radius: 3px; }

/* ================================================================ modal === */
.modal {
  position: fixed; inset: 0; z-index: 20;
  display: flex; align-items: center; justify-content: center;
  background: rgba(5, 6, 8, 0.7);
}
.modal.hidden { display: none; }
.modal-card {
  width: min(420px, calc(100vw - 32px));
  background: linear-gradient(180deg, #1d2024, #15171a);
  border: 1px solid var(--panel-edge);
  border-radius: 12px;
  padding: 18px;
  display: flex; flex-direction: column; gap: 12px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
}
.modal-title { font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
.modal-body { font-size: 13px; color: var(--muted); line-height: 1.5; }
.modal-body b { color: var(--text); }
#modal-input {
  background: var(--screen); color: var(--accent);
  border: 1px solid var(--panel-edge); border-radius: 6px;
  padding: 9px 10px; font: 14px var(--mono); outline: none;
  user-select: text;
}
#modal-input:focus { border-color: var(--accent-dim); }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

/* ============================================================ page tabs === */
.page-tabs {
  display: flex; align-items: center; gap: 4px;
  border-bottom: 1px solid var(--panel-edge);
  padding: 0 2px;
  margin-bottom: -6px;
}
.page-tab {
  display: flex; align-items: center; gap: 7px;
  background: transparent;
  border: 1px solid transparent; border-bottom: none;
  border-radius: 7px 7px 0 0;
  padding: 7px 14px 6px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.16em;
  color: var(--muted);
  cursor: pointer;
  position: relative; top: 1px;
}
.page-tab:hover { color: var(--text); }
.page-tab.active { color: var(--accent); background: var(--panel); border-color: var(--panel-edge); }
.page-tab .led { width: 6px; height: 6px; }
.page-hint { margin-left: auto; font-size: 10px; color: var(--faint); letter-spacing: 0.04em; padding-right: 4px; }

.pages { display: grid; }
.page { grid-area: 1 / 1; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.page:not(.active) { visibility: hidden; pointer-events: none; }

/* ======================================================= modulation page === */
.modpage-row { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 0.9fr) minmax(0, 1.8fr); gap: 12px; flex: 1; }
.fxpage-row  { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 12px; flex: 1; }
.panel.off .switch-row { opacity: 0.55; }
.lfo-panel .screen, .drive-panel .screen, .voice-panel .screen { height: 70px; }
.scr-head { stroke: #f4f4f4; stroke-width: 1.2; vector-effect: non-scaling-stroke; opacity: 0.75; }

.rate-slot { display: flex; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.labeled-row { display: grid; grid-template-columns: 52px auto 1fr; align-items: center; gap: 8px; }
.labeled-row .seg { justify-self: start; }

/* segmented choice */
.seg {
  display: inline-flex;
  background: #101215;
  border: 1px solid var(--panel-edge);
  border-radius: 6px;
  padding: 2px;
  gap: 2px;
}
.seg button {
  background: transparent; border: none; border-radius: 4px;
  padding: 4px 8px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted);
  cursor: pointer;
}
.seg button:hover { color: var(--text); }
.seg button.on { background: #2b211a; color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent-dim); }
.seg button:focus-visible { outline: 1px solid var(--accent); }

/* dropdown */
.param-select {
  min-width: 0; width: 100%;
  background: var(--screen); color: var(--text);
  border: 1px solid var(--panel-edge); border-radius: 5px;
  padding: 4px 2px 4px 4px;
  font: 600 11px var(--sans);
  cursor: pointer;
}
.param-select:hover { border-color: #3a3f47; }
.param-select:focus-visible { outline: 1px solid var(--accent); }

/* ---- matrix --------------------------------------------------------------- */
.matrix-panel { gap: 8px; }
.mx-add { padding: 3px 10px; font-size: 10px; }
.mx-add:disabled { opacity: 0.4; cursor: default; }
.mx-head, .mx-row {
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr) minmax(0, 0.95fr) minmax(0, 1.15fr) 100px 20px;
  align-items: center;
  gap: 6px;
}
.mx-head span { font-size: 9px; font-weight: 700; letter-spacing: 0.14em; color: var(--faint); }
.mx-rows { display: flex; flex-direction: column; gap: 5px; }
.mx-row { background: #121417; border: 1px solid #1f2227; border-radius: 7px; padding: 3px 5px; }
.mx-row.off .param-select, .mx-row.off .mx-amt { opacity: 0.4; }
.mx-on { padding: 4px 6px; justify-content: center; }
.mx-on span:last-child { display: none; }
.mx-amt { display: flex; align-items: center; gap: 4px; }
.mx-amt-text { font-family: var(--mono); font-size: 11px; color: var(--text); white-space: nowrap; }
.mx-del {
  width: 20px; height: 20px; padding: 0;
  background: transparent; border: none; border-radius: 4px;
  color: var(--muted); font-size: 15px; line-height: 1; cursor: pointer;
}
.mx-del:hover { background: #3a1a15; color: #ff9c8a; }
.mx-empty { font-size: 12px; color: var(--muted); line-height: 1.6; padding: 6px 4px; }
.mx-empty i { color: var(--text); font-style: normal; font-family: var(--mono); font-size: 11px; }

.knob.knob-sm { width: 34px; gap: 0; }
.knob.knob-sm .knob-svg { width: 32px; height: 32px; }
.knob.knob-sm .knob-label, .knob.knob-sm .knob-value { display: none; }
.knob.knob-sm .k-track, .knob.knob-sm .k-value { stroke-width: 5; }

/* ======================================================== keybed wheel === */
.wheel-ctl { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; width: 40px; flex: none; }
.wheel-svg { width: 26px; height: 110px; cursor: ns-resize; touch-action: none; outline: none; }
.wheel-svg:focus-visible .wh-slot { stroke: var(--accent); }
.wh-slot { fill: #0b0c0e; stroke: #2c2f35; }
.wh-ridges line { stroke: #1b1d21; stroke-width: 1.5; }
.wh-fill { fill: var(--accent-dim); opacity: 0.55; }
.wh-thumb { fill: #e9e9e6; stroke: #8f8f8f; }
.wheel-ctl:hover .wh-thumb { fill: #fff; }
.wheel-value { font-family: var(--mono); font-size: 10px; color: var(--accent); }

/* ============================================================ header ===== */
.bpm-ctl input {
  width: 52px;
  background: var(--screen); color: var(--accent);
  border: 1px solid var(--panel-edge); border-radius: 4px;
  padding: 3px 4px;
  font: 600 11px var(--mono);
  text-align: right;
}
.bpm-ctl input[readonly] { color: var(--muted); border-color: transparent; background: transparent; cursor: default; }
.bpm-ctl input::-webkit-inner-spin-button { opacity: 0.4; }
.web-only { display: none !important; }
body.web .web-only { display: flex !important; }

/* ============================================================== samples === */
.smp-row {
  display: grid;
  grid-template-columns: 96px auto minmax(0, 1fr) 20px;
  align-items: center;
  gap: 6px;
  border-top: 1px solid #1f2227;
  padding-top: 8px;
}
.smp-load { padding: 4px 8px; font-size: 10px; }
.smp-name { font-family: var(--mono); font-size: 10px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.smp-name.loaded { color: var(--text); }
.smp-clear { visibility: hidden; }
.screen.sample .scr-line { stroke-width: 1.1; }
.panel.drop { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent-dim), 0 0 18px var(--accent-glow); }
.panel.off .smp-row { opacity: 0.38; }

</style>

  <script>
// ============================================================================
//  Parameter definitions. Must match vst/Source/Params.h exactly (IDs, ranges,
//  defaults, choice lists, order). The web build (web/index.html) is generated
//  from this file. New parameters are only appended, with neutral defaults.
// ============================================================================
'use strict';

const WAVE_NAMES = ['Sine', 'Saw', 'Square', 'Triangle'];
const LFO_WAVES = ['Sine', 'Triangle', 'Square', 'Saw Up', 'Saw Down', 'S&H'];
const LFO_DIVS = ['1/1', '1/2D', '1/2', '1/2T', '1/4D', '1/4', '1/4T', '1/8D', '1/8', '1/8T',
                  '1/16D', '1/16', '1/16T', '1/32', '1/32T'];
const LFO_MODES = ['Global', 'Voice'];
const LFO_TRIGS = ['Free', 'Note'];
const MOD_SOURCES = ['None', 'LFO 1', 'LFO 2', 'Amp Env', 'Filter Env', 'Velocity', 'Mod Wheel'];
const MOD_DESTS = ['None', 'Cutoff', 'Resonance', 'Pitch (All)', 'Osc 1 Pitch', 'Osc 2 Pitch', 'Osc 3 Pitch',
                   'Osc 1 Level', 'Osc 2 Level', 'Osc 3 Level', 'Amplitude', 'Pan'];
const DRIVE_TYPES = ['Soft', 'Hard', 'Fold', 'Crush'];
const VOICE_MODES = ['Poly', 'Mono', 'Legato'];
const GLIDE_MODES = ['Always', 'Legato'];
const SAMPLE_MODES = ['Off', 'One-shot', 'Loop', 'Cycle'];
const NUM_VOICES = 88;
const NUM_MOD_SLOTS = 8;

const choiceParam = (id, name, group, choices, def) =>
  ({ id, name, group, type: 'choice', min: 0, max: choices.length - 1, step: 1, def, choices });
const boolParam = (id, name, group, def) =>
  ({ id, name, group, type: 'bool', min: 0, max: 1, step: 1, def });

function oscParams(n) {
  return [
    boolParam(`osc${n}On`, 'On', `osc${n}`, n === 1 ? 1 : 0),
    choiceParam(`osc${n}Wave`, 'Wave', `osc${n}`, WAVE_NAMES, 0),
    { id: `osc${n}Pitch`, name: 'Pitch', group: `osc${n}`, min: -36,  max: 36,  step: 1, def: 0, unit: 'st', bipolar: true },
    { id: `osc${n}Fine`,  name: 'Fine',  group: `osc${n}`, min: -100, max: 100, step: 1, def: 0, unit: 'ct', bipolar: true },
    { id: `osc${n}Level`, name: 'Level', group: `osc${n}`, min: 0,    max: 1,   def: 0.7, unit: '%' },
  ];
}

function lfoParams(n) {
  const g = `lfo${n}`;
  return [
    boolParam(`${g}On`, 'On', g, 0),
    choiceParam(`${g}Wave`, 'Wave', g, LFO_WAVES, 0),
    { id: `${g}Rate`, name: 'Rate', group: g, min: 0.02, max: 40, def: 2, unit: 'lfohz', skew: 'log' },
    boolParam(`${g}Sync`, 'Sync', g, 0),
    choiceParam(`${g}Div`, 'Rate', g, LFO_DIVS, 8),
    choiceParam(`${g}Mode`, 'Mode', g, LFO_MODES, 0),
    choiceParam(`${g}Trig`, 'Trigger', g, LFO_TRIGS, 0),
    { id: `${g}Phase`, name: 'Phase', group: g, min: 0, max: 360, def: 0, unit: 'deg' },
    { id: `${g}Amount`, name: 'Amount', group: g, min: 0, max: 1, def: 1, unit: '%' },
  ];
}

function modSlotParams(n) {
  const g = 'matrix';
  return [
    boolParam(`mod${n}On`, 'On', g, 1),
    choiceParam(`mod${n}Src`, 'Source', g, MOD_SOURCES, 0),
    choiceParam(`mod${n}Via`, 'Via', g, MOD_SOURCES, 0),
    choiceParam(`mod${n}Dst`, 'Destination', g, MOD_DESTS, 0),
    { id: `mod${n}Amt`, name: 'Amount', group: g, min: -1, max: 1, def: 0, unit: 'bip', bipolar: true },
  ];
}

const PARAM_DEFS = [
  ...oscParams(1),
  ...oscParams(2),
  ...oscParams(3),
  { id: 'ampAttack',  name: 'Attack',  group: 'amp',    min: 0.001, max: 5,     def: 0.005, unit: 's', skew: 'log' },
  { id: 'ampDecay',   name: 'Decay',   group: 'amp',    min: 0.005, max: 10,    def: 1.0,   unit: 's', skew: 'log' },
  { id: 'ampSustain', name: 'Sustain', group: 'amp',    min: 0,     max: 1,     def: 0.7,   unit: '%' },
  { id: 'ampRelease', name: 'Release', group: 'amp',    min: 0.005, max: 10,    def: 0.3,   unit: 's', skew: 'log' },
  { id: 'ampLevel',   name: 'Amp',     group: 'amp',    min: -30,   max: 6,     def: 0,     unit: 'dB' },
  { id: 'fltCutoff',  name: 'Cutoff',  group: 'filter', min: 20,    max: 20000, def: 8000,  unit: 'Hz', skew: 'log' },
  { id: 'fltReso',    name: 'Reso',    group: 'filter', min: 0,     max: 1,     def: 0.1,   unit: '%' },
  { id: 'fltEnvAmt',  name: 'Env Amt', group: 'filter', min: 0,     max: 1,     def: 0.2,   unit: '%' },
  { id: 'fltDecay',   name: 'Env Dec', group: 'filter', min: 0.005, max: 5,     def: 0.4,   unit: 's', skew: 'log' },
  { id: 'master',     name: 'Master',  group: 'output', min: 0,     max: 1,     def: 0.7,   unit: '%', noPreset: true },
  ...lfoParams(1),
  ...lfoParams(2),
  ...Array.from({ length: NUM_MOD_SLOTS }, (_, i) => modSlotParams(i + 1)).flat(),
  boolParam('drvOn', 'On', 'drive', 0),
  choiceParam('drvType', 'Type', 'drive', DRIVE_TYPES, 0),
  { id: 'drvDrive', name: 'Drive',  group: 'drive', min: 0,   max: 1, def: 0.3, unit: '%' },
  { id: 'drvTone',  name: 'Tone',   group: 'drive', min: 0,   max: 1, def: 1,   unit: '%' },
  { id: 'drvMix',   name: 'Mix',    group: 'drive', min: 0,   max: 1, def: 1,   unit: '%' },
  { id: 'drvOut',   name: 'Output', group: 'drive', min: -24, max: 6, def: 0,   unit: 'dB' },
  choiceParam('voiceMode', 'Mode', 'voice', VOICE_MODES, 0),
  boolParam('glideOn', 'Glide', 'voice', 0),
  { id: 'glideTime', name: 'Time', group: 'voice', min: 0.001, max: 5, def: 0.1, unit: 's', skew: 'log' },
  choiceParam('glideMode', 'Glide Mode', 'voice', GLIDE_MODES, 0),
  // play a loaded sample instead of the waveform (per oscillator)
  choiceParam('osc1Smp', 'Sample', 'osc1', SAMPLE_MODES, 0),
  choiceParam('osc2Smp', 'Sample', 'osc2', SAMPLE_MODES, 0),
  choiceParam('osc3Smp', 'Sample', 'osc3', SAMPLE_MODES, 0),
];

const PARAM_BY_ID = Object.fromEntries(PARAM_DEFS.map(d => [d.id, d]));

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

function defaultParamValues() {
  return Object.fromEntries(PARAM_DEFS.map(d => [d.id, d.def]));
}

// value <-> 0..1 normalized (same mapping the VST host will see)
function paramToNorm(d, v) {
  if (d.skew === 'log') return clamp(Math.log(v / d.min) / Math.log(d.max / d.min), 0, 1);
  return clamp((v - d.min) / (d.max - d.min), 0, 1);
}

function paramFromNorm(d, n) {
  n = clamp(n, 0, 1);
  let v = d.skew === 'log' ? d.min * Math.pow(d.max / d.min, n) : d.min + n * (d.max - d.min);
  if (d.step) v = Math.round(v / d.step) * d.step;
  return clamp(v, d.min, d.max);
}

function formatParam(d, v) {
  if (d.type === 'choice') return d.choices[clamp(Math.round(v), 0, d.choices.length - 1)];
  if (d.type === 'bool') return v >= 0.5 ? 'On' : 'Off';
  switch (d.unit) {
    case 's':     return v < 1 ? `${Math.round(v * 1000)} ms` : `${v.toFixed(2)} s`;
    case 'Hz':    return v >= 1000 ? `${(v / 1000).toFixed(v >= 10000 ? 1 : 2)} kHz` : `${Math.round(v)} Hz`;
    case 'lfohz': return `${v.toFixed(v < 1 ? 3 : v < 10 ? 2 : 1)} Hz`;
    case 'st':    return `${v > 0 ? '+' : ''}${v} st`;
    case 'ct':    return `${v > 0 ? '+' : ''}${v} ct`;
    case '%':     return `${Math.round(v * 100)}%`;
    case 'bip':   return `${v > 0.004 ? '+' : ''}${Math.round(v * 100)}%`;
    case 'dB':    return `${v > 0.05 ? '+' : ''}${v.toFixed(1)} dB`;
    case 'deg':   return `${Math.round(v)}°`;
    default:      return String(v);
  }
}

</script>

  "categories": [

    onMessage(m) {
      const e = this.engine;
      switch (m.type) {
        case 'param': this.values[m.id] = m.value; this.dirty = true; break;
        case 'params': Object.assign(this.values, m.values); this.dirty = true; break;
        case 'noteOn': this.applyParams(); e.noteOn(m.note, m.vel); break;
        case 'noteOff': this.applyParams(); e.noteOff(m.note); break;
        case 'sustain': e.setSustain(!!m.on); break;
        case 'bend': e.setPitchBend(m.value); break;
        case 'modWheel': e.setModWheel(m.value); break;
        case 'tempo': this.bpm = m.bpm; break;
        case 'sample': e.setSample(m.osc, m.data && m.data.length > 1 ? makeSampleBuffer(m.data, m.rate, m.root) : null); break;
        case 'allNotesOff': e.allNotesOff(); break;
        case 'panic': e.panic(); break;
      }
    }

    applyParams() {
      if (!this.dirty) return;
      this.engine.setParams(makeEngineParams(this.values, this.P));
      this.dirty = false;
    }

    process(inputs, outputs) {
      const out = outputs[0];
      const L = out[0];
      if (!L) return true;
      const R = out.length > 1 ? out[1] : null;
      this.applyParams();
      this.engine.setTransport(this.bpm, 0, false);
      this.engine.render(L, R, 0, L.length);

      if (++this.blockCount >= 16) { // ~43 ms @ 48k
        const e = this.engine;
        this.port.postMessage({ type: 'stats', voices: e.active, peak: e.peak, sustain: e.sustainPedal,
                                modWheel: e.wheelTarget, bpm: this.bpm });
        this.blockCount = 0;
        e.peak = 0;
      }
      return true;
    }
  }

  registerProcessor('epiano-synth', SynthProcessor);
}

<script>
// ============================================================================
//  Web host — stands in for the plugin's C++ side when the UI runs in a
//  browser. It provides window.__JUCE__.backend with exactly the events the
//  JUCE editor uses (see PluginEditor.h), so vst/ui runs unchanged:
//    audio   Web Audio: AudioWorklet (or ScriptProcessor fallback on file://)
//            running dsp-worklet.js, the JS twin of SynthEngine.h
//    MIDI    Web MIDI (all inputs or one), incl. sustain, pitch bend, mod wheel
//    tempo   user-set BPM (the plugin uses the DAW's)
//    presets factory (FACTORY_JSON), this browser (localStorage), or a linked
//            folder on disk (File System Access API) — same .epreset format
// ============================================================================
(function () {
  'use strict';

  // ---------------------------------------------------------- the bridge ---
  const listeners = {};
  const handlers = {};
  const toUi = (ev, data) => queueMicrotask(() => (listeners[ev] || []).forEach(f => f(data)));
  window.__JUCE__ = {
    backend: {
      addEventListener(ev, fn) { (listeners[ev] = listeners[ev] || []).push(fn); },
      // handled synchronously so file pickers / permission prompts keep the click's user activation
      emitEvent(ev, data) { const h = handlers[ev]; if (h) h(data || {}); },
    },
  };
  const message = (text) => toUi('message', { text });
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  };

  // ------------------------------------------------------ factory presets ---
  // compact: [name, osc1, osc2, osc3, [a,d,s,r], [cut,res,env,dec], ampDb, {extra}?]
  const FACTORY = [];
  for (const cat of FACTORY_JSON.categories) {
    for (const p of cat.presets) {
      const v = {};
      for (let k = 0; k < 3; k++) {
        const o = p[k + 1], n = k + 1;
        v[`osc${n}On`] = o[0]; v[`osc${n}Wave`] = o[1]; v[`osc${n}Pitch`] = o[2];
        v[`osc${n}Fine`] = o[3]; v[`osc${n}Level`] = o[4];
      }
      [v.ampAttack, v.ampDecay, v.ampSustain, v.ampRelease] = p[4];
      [v.fltCutoff, v.fltReso, v.fltEnvAmt, v.fltDecay] = p[5];
      v.ampLevel = p[6];
      if (p[7]) Object.assign(v, p[7]);
      FACTORY.push({ id: `factory:${FACTORY.length}`, name: p[0], category: cat.name, factory: true, values: v });
    }
  }

  // ---------------------------------------------------------------- state ---
  const values = defaultParamValues();
  const samples = [null, null, null]; // oscillator samples: { name, rate, root, data: Float32Array }
  let current = { id: '', name: '', category: '' };
  let tempo = clamp(Number(store.get('epiano.tempo')) || 120, 20, 300);

  // Missing params -> default (so v0.9 presets stay neutral); master untouched.
  function presetValues(pv) {
    const out = {};
    for (const d of PARAM_DEFS) {
      if (d.noPreset) continue;
      let v = Number(pv[d.id]);
      if (pv[d.id] === undefined || pv[d.id] === null || isNaN(v)) v = d.def;
      v = clamp(v, d.min, d.max);
      if (d.step) v = Math.round(v / d.step) * d.step;
      out[d.id] = v;
    }
    return out;
  }
  // samplesJson: optional { "1": {name, rate, root, pcm16}, ... } embedded in user presets.
  // Presets without samples (all factory presets) leave loaded samples alone, like the plugin.
  function applyPreset(pv, info, samplesJson) {
    const all = presetValues(pv);
    Object.assign(values, all);
    audio.post({ type: 'params', values: all });
    if (samplesJson && typeof samplesJson === 'object') {
      for (let k = 0; k < 3; k++) { const s = sampleFromJson(samplesJson[String(k + 1)]); if (s) setSample(k, s); }
    }
    current = info;
    toUi('params', Object.assign({}, values));
    toUi('preset', current);
  }

  // start on the first factory preset, like a fresh plugin instance (before audio starts)
  Object.assign(values, presetValues(FACTORY[0].values));
  current = { id: FACTORY[0].id, name: FACTORY[0].name, category: FACTORY[0].category };

  // ---------------------------------------------------------------- audio ---
  const audio = {
    ctx: null, node: null, port: null, mode: '', error: '',
    post(m) { if (this.port) this.port.postMessage(m); },
    get running() { return !!this.ctx && this.ctx.state === 'running'; },

    async start() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
      this.ctx = ctx;
      ctx.onstatechange = sendConfig;
      const src = `(${synthWorkletModule.toString()})();`;
      let built = null;
      if (ctx.audioWorklet && location.protocol !== 'file:') {
        try {
          const url = URL.createObjectURL(new Blob([src], { type: 'application/javascript' }));
          try { await ctx.audioWorklet.addModule(url); } finally { URL.revokeObjectURL(url); }
          const node = new AudioWorkletNode(ctx, 'epiano-synth', {
            numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2],
            processorOptions: { params: values },
          });
          node.port.onmessage = (e) => onDspMessage(e.data);
          built = { node, port: node.port, mode: 'AudioWorklet' };
        } catch (e) { console.warn('AudioWorklet unavailable, using ScriptProcessor', e); }
      }
      if (!built) built = this.scriptProcessor(ctx, src);
      this.node = built.node; this.port = built.port; this.mode = built.mode;
      this.node.connect(ctx.destination);
      this.post({ type: 'tempo', bpm: tempo });
      samples.forEach((s, k) => { if (s) postSample(k); }); // anything loaded before audio was ready
      sendConfig();
    },

    // Chrome/Edge block worklet modules on file:// — run the same DSP on the main thread
    scriptProcessor(ctx, src) {
      class AudioWorkletProcessorShim { constructor() { this.port = { postMessage: onDspMessage, onmessage: null }; } }
      let Processor = null;
      new Function('AudioWorkletProcessor', 'registerProcessor', 'sampleRate', src)(
        AudioWorkletProcessorShim, (name, cls) => { Processor = cls; }, ctx.sampleRate);
      const proc = new Processor({ processorOptions: { params: values } });
      const L128 = new Float32Array(128), R128 = new Float32Array(128);
      const node = ctx.createScriptProcessor(1024, 0, 2);
      node.onaudioprocess = (e) => {
        const L = e.outputBuffer.getChannelData(0), R = e.outputBuffer.getChannelData(1);
        for (let off = 0; off < L.length; off += 128) {
          proc.process([], [[L128, R128]]);
          L.set(L128, off); R.set(R128, off);
        }
      };
      return { node, port: { postMessage: (m) => proc.port.onmessage({ data: m }) }, mode: 'ScriptProcessor' };
    },
  };

  function onDspMessage(m) { if (m.type === 'stats') toUi('stats', m); }

  function sendConfig() {
    const c = audio.ctx;
    let text;
    if (audio.error) text = `Audio error: ${audio.error}`;
    else if (!audio.running) text = 'Click anywhere to enable audio';
    else text = `Web · ${audio.mode} · ${(c.sampleRate / 1000).toFixed(1)} kHz · ~${(((c.baseLatency || 0) + (c.outputLatency || 0)) * 1000).toFixed(1)} ms`;
    toUi('config', { wrapper: 'Web', sampleRate: c ? c.sampleRate : 0, blockSize: 128, audio: text, running: audio.running });
  }

  const started = audio.start().catch((e) => { audio.error = e.message || String(e); console.error(e); sendConfig(); });
  function unlockAudio() {
    if (audio.running || audio.error) return;
    started.then(() => audio.ctx && audio.ctx.resume()).then(sendConfig).catch(() => {});
  }
  document.addEventListener('pointerdown', unlockAudio, true);
  document.addEventListener('keydown', unlockAudio, true);

  // -------------------------------------------------------------- samples ---
  // Same rules as vst/Source/SampleData.cpp: mono, peak-normalised, max 10 s,
  // root = WAV 'smpl' unity note (else C4). Stored in presets as base64 int16.
  const MAX_SAMPLE_SECONDS = 10;

  function postSample(k) {
    const s = samples[k];
    audio.post({ type: 'sample', osc: k, data: s ? s.data.slice() : null, rate: s ? s.rate : 0, root: s ? s.root : 60 });
  }

  function samplePeaks(s, points) {
    const out = [], n = s.data.length;
    for (let i = 0; i < points; i++) {
      const a = Math.floor(i * n / points), b = Math.max(a + 1, Math.floor((i + 1) * n / points));
      let mn = 0, mx = 0;
      for (let j = a; j < b && j < n; j++) { const x = s.data[j]; if (x < mn) mn = x; if (x > mx) mx = x; }
      out.push(Math.round(mn * 1000) / 1000, Math.round(mx * 1000) / 1000);
    }
    return out;
  }

  function sendSamples() {
    toUi('samples', { slots: samples.map(s => s ? { name: s.name, root: s.root, seconds: s.data.length / s.rate, peaks: samplePeaks(s, 100) } : null) });
  }

  function setSample(k, s) {
    samples[k] = s;
    postSample(k);
    sendSamples();
  }

  // WAV 'smpl' chunk -> MIDI unity note (null if absent / not a WAV)
  function wavRootNote(buf) {
    const v = new DataView(buf);
    const tag = (o) => String.fromCharCode(v.getUint8(o), v.getUint8(o + 1), v.getUint8(o + 2), v.getUint8(o + 3));
    if (buf.byteLength < 12 || tag(0) !== 'RIFF' || tag(8) !== 'WAVE') return null;
    for (let o = 12; o + 8 <= buf.byteLength;) {
      const size = v.getUint32(o + 4, true);
      if (tag(o) === 'smpl' && size >= 16 && o + 24 <= buf.byteLength) return Math.min(127, v.getUint32(o + 20, true));
      o += 8 + size + (size & 1);
    }
    return null;
  }

  // PCM / float WAV read directly (keeps the file's own sample rate, like the plugin).
  // Returns { sampleRate, length, numberOfChannels, getChannelData(c) } or null.
  function parseWav(buf) {
    const v = new DataView(buf);
    const tag = (o) => String.fromCharCode(v.getUint8(o), v.getUint8(o + 1), v.getUint8(o + 2), v.getUint8(o + 3));
    if (buf.byteLength < 12 || tag(0) !== 'RIFF' || tag(8) !== 'WAVE') return null;
    let fmt = null, dataOff = -1, dataLen = 0;
    for (let o = 12; o + 8 <= buf.byteLength;) {
      const id = tag(o), size = v.getUint32(o + 4, true);
      if (id === 'fmt ') {
        let format = v.getUint16(o + 8, true);
        if (format === 0xfffe && size >= 26) format = v.getUint16(o + 32, true); // WAVE_FORMAT_EXTENSIBLE
        fmt = { format, channels: v.getUint16(o + 10, true), rate: v.getUint32(o + 12, true), bits: v.getUint16(o + 22, true) };
      } else if (id === 'data') { dataOff = o + 8; dataLen = Math.min(size, buf.byteLength - dataOff); }
      o += 8 + size + (size & 1);
    }
    if (!fmt || dataOff < 0 || !fmt.channels || !fmt.rate) return null;
    const { format, channels, bits } = fmt, bps = bits >> 3;
    if (!((format === 1 && [8, 16, 24, 32].includes(bits)) || (format === 3 && (bits === 32 || bits === 64)))) return null;
    const frames = Math.floor(dataLen / (bps * channels));
    const chans = Array.from({ length: channels }, () => new Float32Array(frames));
    for (let i = 0, p = dataOff; i < frames; i++) {
      for (let c = 0; c < channels; c++, p += bps) {
        let x;
        if (format === 3) x = bits === 32 ? v.getFloat32(p, true) : v.getFloat64(p, true);
        else if (bits === 8) x = (v.getUint8(p) - 128) / 128;
        else if (bits === 16) x = v.getInt16(p, true) / 32768;
        else if (bits === 24) { let s = v.getUint8(p) | (v.getUint8(p + 1) << 8) | (v.getUint8(p + 2) << 16); if (s & 0x800000) s -= 0x1000000; x = s / 8388608; }
        else x = v.getInt32(p, true) / 2147483648;
        chans[c][i] = x;
      }
    }
    return { sampleRate: fmt.rate, length: frames, numberOfChannels: channels, getChannelData: (c) => chans[c] };
  }

  async function decodeSample(arrayBuffer, name) {
    const root = wavRootNote(arrayBuffer);
    let buf = parseWav(arrayBuffer);
    if (!buf) { // AIFF / FLAC / OGG / MP3 / unusual WAV: let the browser decode it
      const ctx = audio.ctx || new OfflineAudioContext(1, 1, 48000);
      try { buf = await ctx.decodeAudioData(arrayBuffer.slice(0)); }
      catch (e) { throw new Error(`Couldn't read audio from ${name} (try WAV, AIFF, FLAC, OGG or MP3)`); }
    }
    if (!buf.length) throw new Error(`${name} contains no audio`);
    const len = Math.min(buf.length, Math.floor(buf.sampleRate * MAX_SAMPLE_SECONDS));
    const data = new Float32Array(len);
    for (let c = 0; c < buf.numberOfChannels; c++) {
      const ch = buf.getChannelData(c);
      for (let i = 0; i < len; i++) data[i] += ch[i] / buf.numberOfChannels;
    }
    let peak = 0;
    for (let i = 0; i < len; i++) peak = Math.max(peak, Math.abs(data[i]));
    if (peak > 1e-6) for (let i = 0; i < len; i++) data[i] /= peak;
    return { name, rate: buf.sampleRate, root: root === null ? 60 : root, data, truncated: buf.length > len };
  }

  async function loadSampleBytes(k, arrayBuffer, name) {
    try {
      const s = await decodeSample(arrayBuffer, name);
      setSample(k, s);
      const id = `osc${k + 1}Smp`;
      if ((values[id] | 0) === 0) { // loading a sample switches that oscillator over to it
        values[id] = 1;
        audio.post({ type: 'param', id, value: 1 });
        toUi('params', { [id]: 1 });
      }
      message(s.truncated ? `${name} is longer than ${MAX_SAMPLE_SECONDS} s — using the first ${MAX_SAMPLE_SECONDS} s`
                          : `Loaded ${name} into OSC ${k + 1}`);
    } catch (e) { message(e.message || String(e)); }
  }

  function sampleToJson(s) {
    const pcm = new Int16Array(s.data.length);
    for (let i = 0; i < pcm.length; i++) pcm[i] = Math.round(clamp(s.data[i], -1, 1) * 32767);
    const bytes = new Uint8Array(pcm.buffer);
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return { name: s.name, rate: s.rate, root: s.root, pcm16: btoa(bin) };
  }
  function sampleFromJson(j) {
    if (!j || typeof j.pcm16 !== 'string') return null;
    const bin = atob(j.pcm16);
    const n = bin.length >> 1;
    if (n < 2) return null;
    const data = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      let v = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8);
      if (v >= 0x8000) v -= 0x10000;
      data[i] = v / 32767;
    }
    return { name: String(j.name || 'sample'), rate: clamp(Number(j.rate) || 44100, 1000, 384000), root: clamp(Math.round(Number(j.root) || 60), 0, 127), data };
  }

  const sampleInput = document.createElement('input');
  sampleInput.type = 'file';
  sampleInput.accept = '.wav,.wave,.aif,.aiff,.flac,.ogg,.mp3,audio/*';
  sampleInput.style.display = 'none';
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(sampleInput));
  let sampleTarget = 0;
  sampleInput.addEventListener('change', async () => {
    const f = sampleInput.files && sampleInput.files[0];
    sampleInput.value = '';
    if (f) loadSampleBytes(sampleTarget, await f.arrayBuffer(), f.name);
  });

  // ---------------------------------------------------------------- notes ---
  const sounding = new Set();
  function noteOn(note, vel) {
    if (!audio.running) message('Audio is off — click anywhere on the page once to enable it');
    audio.post({ type: 'noteOn', note, vel });
    sounding.add(note);
    toUi('notes', { on: [note], off: [] });
  }
  function noteOff(note) {
    audio.post({ type: 'noteOff', note });
    if (sounding.delete(note)) toUi('notes', { on: [], off: [note] });
  }
  function allOff() {
    const off = [...sounding];
    sounding.clear();
    if (off.length) toUi('notes', { on: [], off });
  }

  // ----------------------------------------------------------------- MIDI ---
  const midi = { access: null, selected: store.get('epiano.midiInput') || 'all' };
  function midiInputs() {
    return midi.access ? Array.from(midi.access.inputs.values()).map(i => ({ id: i.id, name: i.name, state: i.state })) : [];
  }
  function bindMidi() {
    if (!midi.access) return;
    for (const input of midi.access.inputs.values()) {
      const on = midi.selected === 'all' || midi.selected === input.id;
      input.onmidimessage = on ? (e) => onMidi(e.data) : null;
    }
  }
  function onMidi(d) {
    const st = d[0];
    if (st >= 0xf0) return;
    const cmd = st & 0xf0;
    if (cmd === 0x90 && d[2] > 0) noteOn(d[1], d[2]);
    else if (cmd === 0x80 || cmd === 0x90) noteOff(d[1]);
    else if (cmd === 0xb0) {
      if (d[1] === 64) audio.post({ type: 'sustain', on: d[2] >= 64 });
      else if (d[1] === 1) audio.post({ type: 'modWheel', value: d[2] / 127 });
      else if (d[1] === 120) { audio.post({ type: 'panic' }); allOff(); }
      else if (d[1] === 123) { audio.post({ type: 'allNotesOff' }); allOff(); }
    } else if (cmd === 0xe0) {
      audio.post({ type: 'bend', value: (((d[2] << 7) | d[1]) - 8192) / 8192 });
    }
  }
  if (typeof navigator.requestMIDIAccess === 'function') {
    navigator.requestMIDIAccess({ sysex: false }).then((access) => {
      midi.access = access;
      access.onstatechange = () => { bindMidi(); toUi('midiInputs', { inputs: midiInputs(), selected: midi.selected }); };
      bindMidi();
      toUi('midiInputs', { inputs: midiInputs(), selected: midi.selected });
      const n = midiInputs().length;
      message(n ? `MIDI ready — ${n} input(s): ${midiInputs().map(i => i.name).join(', ')}` : 'MIDI ready — no devices found (plug one in, it appears automatically)');
    }).catch((e) => {
      toUi('midiInputs', { inputs: [], selected: 'all', error: true });
      message(`MIDI unavailable: ${e.message || e}`);
    });
  } else {
    queueMicrotask(() => toUi('midiInputs', { inputs: [], selected: 'all', error: true }));
  }

  // -------------------------------------------------------------- presets ---
  const PRESET_EXT = '.epreset';
  const LS_KEY = 'epiano.userPresets.v1';
  const local = {
    read() { try { return JSON.parse(store.get(LS_KEY)) || {}; } catch (e) { return {}; } },
    write(obj) { return store.set(LS_KEY, JSON.stringify(obj)); },
  };
  const localPresets = () => Object.keys(local.read()).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))
    .map(name => ({ id: `local:${name}`, name, category: 'User', factory: false }));

  const fsSupported = typeof window.showDirectoryPicker === 'function';
  const folder = { handle: null, granted: false, files: [], sig: '' };
  const idb = {
    open() {
      return new Promise((res, rej) => {
        const r = indexedDB.open('epiano', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    },
    async get(key) {
      const db = await this.open();
      return new Promise((res) => { const r = db.transaction('kv').objectStore('kv').get(key); r.onsuccess = () => res(r.result); r.onerror = () => res(undefined); });
    },
    async set(key, val) {
      const db = await this.open();
      return new Promise((res) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(val, key); tx.oncomplete = () => res(true); tx.onerror = () => res(false); });
    },
  };

  async function scanFolder() {
    if (!folder.handle || !folder.granted) return false;
    const files = [];
    async function walk(dir, path) {
      for await (const [name, h] of dir.entries()) {
        const rel = path ? `${path}/${name}` : name;
        if (h.kind === 'directory') await walk(h, rel);
        else if (name.toLowerCase().endsWith(PRESET_EXT)) {
          const f = await h.getFile();
          files.push({ id: `user:${rel}`, name: name.slice(0, -PRESET_EXT.length), category: path || 'User',
                       factory: false, handle: h, parent: dir, fileName: name, stamp: `${f.size}:${f.lastModified}` });
        }
      }
    }
    try { await walk(folder.handle, ''); } catch (e) { folder.granted = false; return true; }
    files.sort((a, b) => a.category.localeCompare(b.category) || a.name.localeCompare(b.name, undefined, { numeric: true }));
    const sig = files.map(f => `${f.id}|${f.stamp}`).join(';');
    if (sig === folder.sig) return false;
    folder.sig = sig;
    folder.files = files;
    return true;
  }

  function allPresets() { return [...FACTORY, ...folder.files, ...localPresets()]; }
  function sendPresetList() {
    toUi('presetList', {
      presets: allPresets().map(({ id, name, category, factory }) => ({ id, name, category, factory })),
      folder: folder.granted ? `${folder.handle.name} (linked folder)` : 'this browser — click FOLDER to link a folder on disk',
    });
  }

  async function linkFolder(handle, ask) {
    folder.handle = handle;
    folder.sig = '';
    let state = await handle.queryPermission({ mode: 'readwrite' });
    if (state !== 'granted' && ask) state = await handle.requestPermission({ mode: 'readwrite' });
    folder.granted = state === 'granted';
    await idb.set('presetFolder', handle);
    if (folder.granted) await scanFolder();
    sendPresetList();
    return folder.granted;
  }
  if (fsSupported && window.indexedDB) {
    idb.get('presetFolder').then(async (h) => {
      if (h && !(await linkFolder(h, false))) message(`Click FOLDER to reconnect the preset folder "${h.name}"`);
    }).catch(() => {});
  }
  setInterval(async () => { if (await scanFolder()) sendPresetList(); }, 2000); // autoload

  function parsePresetText(text, fallbackName) {
    let json;
    try { json = JSON.parse(text); } catch (e) { throw new Error(`Not a valid preset file: ${fallbackName}`); }
    const params = json && typeof json.params === 'object' ? json.params : null;
    if (!params || !PARAM_DEFS.some(d => !d.noPreset && d.id in params)) throw new Error(`No E-Piano settings found in ${fallbackName}`);
    return { name: String(json.name || '').trim() || fallbackName, params, samples: json.samples };
  }
  function presetText(name, category) {
    const params = {};
    for (const d of PARAM_DEFS) if (!d.noPreset) params[d.id] = +Number(values[d.id]).toPrecision(6);
    const out = { format: 'E-Piano Preset', version: 1, name, category, params };
    if (samples.some(Boolean)) {
      out.samples = {};
      samples.forEach((s, k) => { if (s) out.samples[String(k + 1)] = sampleToJson(s); });
    }
    return JSON.stringify(out, null, 2);
  }
  const legalName = (s) => s.trim().replace(/[\\/:*?"<>|]/g, '_').slice(0, 60);

  async function loadPresetById(id) {
    const p = allPresets().find(x => x.id === id);
    if (!p) { message('Preset not found (was it moved or deleted?)'); toUi('preset', current); return; }
    try {
      const info = { id, name: p.name, category: p.category };
      if (p.factory) applyPreset(p.values, info);
      else {
        const text = id.startsWith('local:') ? local.read()[p.name] : await (await p.handle.getFile()).text();
        const parsed = parsePresetText(text, p.name);
        applyPreset(parsed.params, info, parsed.samples);
      }
    } catch (e) { message(e.message || String(e)); toUi('preset', current); }
  }

  async function savePreset(rawName, overwrite) {
    const name = legalName(rawName);
    const result = (r) => toUi('saveResult', Object.assign({ name }, r));
    if (!name) return result({ ok: false, error: 'Enter a name for the preset' });
    try {
      if (folder.granted) {
        const fileName = name + PRESET_EXT;
        if (!overwrite) {
          let exists = true;
          try { await folder.handle.getFileHandle(fileName); } catch (e) { exists = false; }
          if (exists) return result({ ok: false, exists: true });
        }
        const w = await (await folder.handle.getFileHandle(fileName, { create: true })).createWritable();
        await w.write(presetText(name, 'User'));
        await w.close();
        await scanFolder();
        current = { id: `user:${fileName}`, name, category: 'User' };
      } else {
        const all = local.read();
        if (!overwrite && all[name]) return result({ ok: false, exists: true });
        all[name] = presetText(name, 'User');
        if (!local.write(all)) throw new Error('browser storage is unavailable (private window?)');
        current = { id: `local:${name}`, name, category: 'User' };
      }
      sendPresetList();
      toUi('preset', current);
      result({ ok: true });
    } catch (e) { result({ ok: false, error: e.message || String(e) }); }
  }

  async function deletePreset(id) {
    const p = allPresets().find(x => x.id === id);
    try {
      if (!p || p.factory) throw new Error('Only user presets can be deleted');
      if (id.startsWith('local:')) { const all = local.read(); delete all[p.name]; local.write(all); }
      else { await p.parent.removeEntry(p.fileName); await scanFolder(); }
      if (current.id === id) current = { id: '', name: current.name, category: 'User' };
      message(`Deleted preset "${p.name}"`);
    } catch (e) { message(e.message || String(e)); }
    sendPresetList();
    toUi('preset', current);
  }

  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = `${PRESET_EXT},application/json`;
  fileInput.style.display = 'none';
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(fileInput));
  fileInput.addEventListener('change', async () => {
    const f = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (!f) return;
    try {
      const p = parsePresetText(await f.text(), f.name.replace(/\.[^.]+$/, ''));
      applyPreset(p.params, { id: `file:${f.name}`, name: p.name, category: 'File' }, p.samples);
      message(`Loaded ${f.name}`);
    } catch (e) { message(e.message || String(e)); }
  });

  async function folderButton() {
    if (!fsSupported) { message('Linking a preset folder needs Chrome or Edge — presets are saved in this browser instead.'); return; }
    try {
      if (folder.handle && !folder.granted) { if (await linkFolder(folder.handle, true)) message(`Reconnected "${folder.handle.name}"`); return; }
      const handle = await window.showDirectoryPicker({ id: 'epiano-presets', mode: 'readwrite', startIn: 'documents' });
      await linkFolder(handle, true);
      message(`Preset folder linked: ${handle.name} — ${folder.files.length} preset(s). Link Documents\\E-Piano\\Presets to share presets with the VST.`);
    } catch (e) { if (e && e.name !== 'AbortError') message(`Folder: ${e.message || e}`); }
  }

  // ------------------------------------------------- UI -> host events ---
  Object.assign(handlers, {
    uiReady() {
      sendConfig();
      sendPresetList();
      toUi('params', Object.assign({}, values));
      toUi('preset', current);
      toUi('stats', { voices: 0, peak: 0, sustain: false, modWheel: 0, bpm: tempo });
      if (midi.access) toUi('midiInputs', { inputs: midiInputs(), selected: midi.selected });
      sendSamples();
    },
    paramMenu() {}, // no host automation menu in a browser
    loadSample({ osc }) { sampleTarget = clamp(osc | 0, 0, 2); sampleInput.click(); },
    dropSample({ osc, name, data }) {
      try {
        const bin = atob(data);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        loadSampleBytes(clamp(osc | 0, 0, 2), bytes.buffer, name);
      } catch (e) { message("Couldn't read the dropped file"); }
    },
    clearSample({ osc }) { setSample(clamp(osc | 0, 0, 2), null); },
    setParam({ id, value }) { if (id in values) { values[id] = value; audio.post({ type: 'param', id, value }); } },
    gesture() {},
    noteOn({ note, vel }) { noteOn(note, vel); },
    noteOff({ note }) { noteOff(note); },
    panic() { audio.post({ type: 'panic' }); allOff(); },
    modWheel({ value }) { audio.post({ type: 'modWheel', value }); },
    setTempo({ bpm }) { tempo = clamp(Number(bpm) || 120, 20, 300); store.set('epiano.tempo', String(tempo)); audio.post({ type: 'tempo', bpm: tempo }); },
    selectMidi({ id }) { midi.selected = id; store.set('epiano.midiInput', id); bindMidi(); },
    loadPreset({ id }) { loadPresetById(id); },
    savePreset({ name, overwrite }) { savePreset(name, overwrite); },
    deletePreset({ id }) { deletePreset(id); },
    loadPresetFile() { fileInput.click(); },
    openPresetFolder() { folderButton(); },
  });
})();

<script>
// ============================================================================
//  JUCE bridge — the plugin's replacement for the web version's WebAudioEngine.
//  Talks to the C++ processor through JUCE 8's native integration
//  (window.__JUCE__.backend), which JUCE injects into the page.
// ============================================================================
'use strict';

class JuceEngine {
  constructor() {
    this.backend = (window.__JUCE__ && window.__JUCE__.backend) || null;
    this.connected = !!this.backend;
    this.ready = true;
    this.handlers = {};
    if (this.backend) {
      for (const ev of ['params', 'notes', 'stats', 'config', 'presetList', 'preset', 'saveResult', 'message', 'midiInputs', 'samples']) {
        this.backend.addEventListener(ev, (data) => { if (this.handlers[ev]) this.handlers[ev](data); });
      }
    }
  }

  on(event, fn) { this.handlers[event] = fn; }
  emit(id, payload) { if (this.backend) this.backend.emitEvent(id, payload || {}); }

  start() { return Promise.resolve(); }
  uiReady() { this.emit('uiReady'); }

  // parameters
  setParam(id, value) { this.emit('setParam', { id, value }); }
  beginGesture(id) { this.emit('gesture', { id, begin: true }); }
  endGesture(id) { this.emit('gesture', { id, begin: false }); }

  // notes
  noteOn(note, vel) { this.emit('noteOn', { note, vel }); }
  noteOff(note) { this.emit('noteOff', { note }); }
  panic() { this.emit('panic'); }
  modWheel(value) { this.emit('modWheel', { value }); }

  // right-click on a control -> the host's parameter menu (automation, MIDI learn...)
  paramMenu(id, x, y) { this.emit('paramMenu', { id, x: Math.round(x), y: Math.round(y) }); }

  // oscillator samples (osc = 0..2)
  loadSample(osc) { this.emit('loadSample', { osc }); }
  clearSample(osc) { this.emit('clearSample', { osc }); }
  async dropSample(osc, file) {
    const bytes = new Uint8Array(await file.arrayBuffer());
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    this.emit('dropSample', { osc, name: file.name, data: btoa(bin) });
  }

  // web build only (the plugin takes tempo + MIDI from the host)
  setTempo(bpm) { this.emit('setTempo', { bpm }); }
  selectMidi(id) { this.emit('selectMidi', { id }); }

  // presets
  loadPreset(id) { this.emit('loadPreset', { id }); }
  savePreset(name, overwrite) { this.emit('savePreset', { name, overwrite: !!overwrite }); }
  deletePreset(id) { this.emit('deletePreset', { id }); }
  loadPresetFile() { this.emit('loadPresetFile'); }
  openPresetFolder() { this.emit('openPresetFolder'); }
}

  <script>
// ============================================================================
//  SVG rotary knob.
//  Drag up/down (Shift = fine), mouse wheel, arrow keys, double-click = default.
//  270° sweep. Bipolar params draw their arc from 12 o'clock.
// ============================================================================
'use strict';

const KNOB_SWEEP = 135; // degrees either side of 12 o'clock

function svgPolar(cx, cy, r, deg) {
  const a = (deg - 90) * Math.PI / 180;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}

function svgArc(cx, cy, r, a0, a1) {
  if (Math.abs(a1 - a0) < 0.5) return '';
  const lo = Math.min(a0, a1), hi = Math.max(a0, a1);
  const [x0, y0] = svgPolar(cx, cy, r, lo);
  const [x1, y1] = svgPolar(cx, cy, r, hi);
  const large = hi - lo > 180 ? 1 : 0;
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}

class Knob {
  // onGesture(true/false) brackets a drag so the DAW records it as one automation gesture.
  constructor(def, value, onChange, onGesture) {
    this.def = def;
    this.onChange = onChange;
    this.onGesture = onGesture || null;
    this.value = value;
    this.drag = null;

    const el = document.createElement('div');
    el.className = 'knob';
    let ticks = '';
    if (def.type === 'choice') {
      const steps = def.max - def.min;
      for (let i = 0; i <= steps; i++) {
        const [x, y] = svgPolar(32, 32, 31, -KNOB_SWEEP + (2 * KNOB_SWEEP * i) / steps);
        ticks += `<circle class="k-tick" cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="1.4"/>`;
      }
    }
    el.innerHTML = `
      <svg class="knob-svg" viewBox="0 0 64 64" tabindex="0" role="slider"
           aria-label="${def.name}" aria-valuemin="${def.min}" aria-valuemax="${def.max}">
        <path class="k-track" d="${svgArc(32, 32, 26, -KNOB_SWEEP, KNOB_SWEEP)}"/>
        ${ticks}
        <path class="k-value" d=""/>
        <circle class="k-face" cx="32" cy="32" r="19"/>
        <g class="k-rot"><line class="k-pointer" x1="32" y1="24" x2="32" y2="15"/></g>
      </svg>
      <div class="knob-value"></div>
      <div class="knob-label">${def.name}</div>`;
    this.el = el;
    this.svg = el.querySelector('svg');
    this.valuePath = el.querySelector('.k-value');
    this.rot = el.querySelector('.k-rot');
    this.readout = el.querySelector('.knob-value');
    this.bindEvents();
    this.render();
  }

  get norm() { return paramToNorm(this.def, this.value); }

  setValue(v, notify = false) {
    v = clamp(v, this.def.min, this.def.max);
    if (v === this.value) return;
    this.value = v;
    this.render();
    if (notify && this.onChange) this.onChange(v);
  }

  setNorm(n) { this.setValue(paramFromNorm(this.def, n), true); }

  nudge(dir, fine) {
    const d = this.def;
    if (d.step) this.setValue(this.value + dir * d.step, true);
    else this.setNorm(this.norm + dir * (fine ? 0.002 : 0.01));
  }

  render() {
    const d = this.def;
    const angle = -KNOB_SWEEP + this.norm * 2 * KNOB_SWEEP;
    const startAngle = d.bipolar ? 0 : -KNOB_SWEEP;
    this.valuePath.setAttribute('d', svgArc(32, 32, 26, startAngle, angle));
    this.rot.setAttribute('transform', `rotate(${angle.toFixed(2)} 32 32)`);
    this.readout.textContent = formatParam(d, this.value);
    this.svg.setAttribute('aria-valuenow', String(this.value));
    this.svg.setAttribute('aria-valuetext', formatParam(d, this.value));
  }

  bindEvents() {
    const svg = this.svg;
    svg.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      svg.setPointerCapture(e.pointerId);
      svg.focus();
      this.drag = { y: e.clientY, norm: this.norm };
      this.el.classList.add('active');
      if (this.onGesture) this.onGesture(true);
    });
    svg.addEventListener('pointermove', (e) => {
      if (!this.drag) return;
      const dy = this.drag.y - e.clientY;
      this.drag.y = e.clientY;
      this.drag.norm = clamp(this.drag.norm + dy * (e.shiftKey ? 0.001 : 0.005), 0, 1);
      this.setNorm(this.drag.norm);
    });
    const end = () => {
      if (!this.drag) return;
      this.drag = null;
      this.el.classList.remove('active');
      if (this.onGesture) this.onGesture(false);
    };
    svg.addEventListener('pointerup', end);
    svg.addEventListener('pointercancel', end);
    svg.addEventListener('dblclick', () => this.setValue(this.def.def, true));
    svg.addEventListener('wheel', (e) => {
      e.preventDefault();
      this.nudge(e.deltaY < 0 ? 1 : -1, e.shiftKey);
    }, { passive: false });
    svg.addEventListener('keydown', (e) => {
      const dir = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
      if (dir) { e.preventDefault(); e.stopPropagation(); this.nudge(dir, e.shiftKey); }
    });
  }
}

  <script>
// ============================================================================
//  Parameter controls besides the knob. Same conventions as Knob:
//  setValue(v) updates the display, onChange(v) fires on user edits.
//    ToggleButton - bool param   (click; double-click = default)
//    Segmented    - choice param (click; wheel / arrow keys step; double-click = default)
//    SelectBox    - choice param (native dropdown; wheel steps; double-click = default)
//    ModWheel     - SVG performance wheel (drag, wheel, arrow keys, double-click = 0)
// ============================================================================
'use strict';

class ToggleButton {
  constructor(def, value, onChange, label) {
    this.def = def;
    this.onChange = onChange;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'power';
    b.innerHTML = `<span class="led"></span><span>${label || 'ON'}</span>`;
    b.addEventListener('click', () => this.onChange(this.value >= 0.5 ? 0 : 1));
    this.el = b;
    this.setValue(value);
  }
  setValue(v) {
    this.value = v;
    this.el.classList.toggle('on', v >= 0.5);
    this.el.setAttribute('aria-pressed', v >= 0.5);
  }
}

class Segmented {
  constructor(def, value, onChange, labels) {
    this.def = def;
    this.onChange = onChange;
    const wrap = document.createElement('div');
    wrap.className = 'seg';
    wrap.setAttribute('role', 'radiogroup');
    wrap.setAttribute('aria-label', def.name);
    this.buttons = (labels || def.choices).map((label, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      b.setAttribute('role', 'radio');
      b.addEventListener('click', () => this.pick(i));
      wrap.appendChild(b);
      return b;
    });
    wrap.addEventListener('wheel', (e) => { e.preventDefault(); this.pick(this.value + (e.deltaY < 0 ? 1 : -1)); }, { passive: false });
    wrap.addEventListener('keydown', (e) => {
      const dir = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
      if (dir) { e.preventDefault(); e.stopPropagation(); this.pick(this.value + dir); this.buttons[this.value].focus(); }
    });
    wrap.addEventListener('dblclick', () => this.pick(this.def.def));
    this.el = wrap;
    this.setValue(value);
  }
  pick(i) {
    i = clamp(Math.round(i), 0, this.buttons.length - 1);
    if (i !== this.value) this.onChange(i);
  }
  setValue(v) {
    this.value = clamp(Math.round(v), 0, this.buttons.length - 1);
    this.buttons.forEach((b, i) => { b.classList.toggle('on', i === this.value); b.setAttribute('aria-checked', i === this.value); });
  }
}

class SelectBox {
  constructor(def, value, onChange, labels) {
    this.def = def;
    this.onChange = onChange;
    const s = document.createElement('select');
    s.className = 'param-select';
    s.setAttribute('aria-label', def.name);
    (labels || def.choices).forEach((label, i) => s.appendChild(new Option(label, String(i))));
    s.addEventListener('change', () => this.onChange(Number(s.value)));
    s.addEventListener('wheel', (e) => {
      e.preventDefault();
      const i = clamp(this.value + (e.deltaY < 0 ? -1 : 1), 0, s.options.length - 1);
      if (i !== this.value) this.onChange(i);
    }, { passive: false });
    s.addEventListener('dblclick', () => { if (this.value !== this.def.def) this.onChange(this.def.def); });
    s.addEventListener('keydown', (e) => e.stopPropagation()); // arrow keys belong to the dropdown, not the piano
    this.el = s;
    this.setValue(value);
  }
  setValue(v) {
    this.value = clamp(Math.round(v), 0, this.el.options.length - 1);
    this.el.value = String(this.value);
  }
}

class ModWheel {
  constructor(onChange, onGesture) {
    this.onChange = onChange;
    this.onGesture = onGesture || null;
    this.value = 0;
    this.drag = null;
    const H = 110, W = 26, T = 16;
    this.H = H; this.T = T;
    const ridges = Array.from({ length: 14 }, (_, i) => `<line x1="4" x2="${W - 4}" y1="${6 + i * 7.5}" y2="${6 + i * 7.5}"/>`).join('');
    const el = document.createElement('div');
    el.className = 'wheel-ctl';
    el.innerHTML = `
      <svg class="wheel-svg" viewBox="0 0 ${W} ${H}" tabindex="0" role="slider" aria-label="Mod wheel"
           aria-valuemin="0" aria-valuemax="127">
        <rect class="wh-slot" x="0.5" y="0.5" width="${W - 1}" height="${H - 1}" rx="5"/>
        <g class="wh-ridges">${ridges}</g>
        <rect class="wh-fill" x="3" width="${W - 6}" rx="3"/>
        <rect class="wh-thumb" x="2" width="${W - 4}" height="${T}" rx="3"/>
      </svg>
      <span class="ctl-label">MOD</span>
      <span class="wheel-value">0</span>`;
    this.el = el;
    this.svg = el.querySelector('svg');
    this.thumb = el.querySelector('.wh-thumb');
    this.fill = el.querySelector('.wh-fill');
    this.readout = el.querySelector('.wheel-value');
    this.bind();
    this.render();
  }

  set(v, notify) {
    v = clamp(v, 0, 1);
    if (v === this.value) return;
    this.value = v;
    this.render();
    if (notify) this.onChange(v);
  }
  setValue(v) { if (!this.drag) this.set(v, false); }

  render() {
    const y = (this.H - this.T - 4) * (1 - this.value) + 2;
    this.thumb.setAttribute('y', y.toFixed(1));
    this.fill.setAttribute('y', (y + this.T / 2).toFixed(1));
    this.fill.setAttribute('height', Math.max(0, this.H - 3 - (y + this.T / 2)).toFixed(1));
    const midi = Math.round(this.value * 127);
    this.readout.textContent = midi;
    this.svg.setAttribute('aria-valuenow', String(midi));
  }

  bind() {
    const svg = this.svg;
    const fromY = (clientY) => {
      const r = svg.getBoundingClientRect();
      return 1 - (clientY - r.top - (this.T / 2) * (r.height / this.H)) / (r.height * (this.H - this.T) / this.H);
    };
    svg.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      svg.setPointerCapture(e.pointerId);
      svg.focus();
      this.drag = { y: e.clientY, v: this.value };
      if (this.onGesture) this.onGesture(true);
      if (!e.shiftKey) this.set(fromY(e.clientY), true); // click jumps, Shift-drag is relative + fine
    });
    svg.addEventListener('pointermove', (e) => {
      if (!this.drag) return;
      if (e.shiftKey) {
        this.drag.v = clamp(this.drag.v + (this.drag.y - e.clientY) * 0.002, 0, 1);
        this.drag.y = e.clientY;
        this.set(this.drag.v, true);
      } else {
        this.drag.y = e.clientY;
        this.drag.v = fromY(e.clientY);
        this.set(this.drag.v, true);
      }
    });
    const end = () => { if (!this.drag) return; this.drag = null; if (this.onGesture) this.onGesture(false); };
    svg.addEventListener('pointerup', end);
    svg.addEventListener('pointercancel', end);
    svg.addEventListener('dblclick', () => this.set(0, true));
    svg.addEventListener('wheel', (e) => { e.preventDefault(); this.set(this.value + (e.deltaY < 0 ? 1 : -1) * (e.shiftKey ? 1 / 127 : 8 / 127), true); }, { passive: false });
    svg.addEventListener('keydown', (e) => {
      const dir = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
      if (dir) { e.preventDefault(); e.stopPropagation(); this.set(this.value + dir * (e.shiftKey ? 1 / 127 : 8 / 127), true); }
    });
  }
}
